contents:
  - name: title
    data: masthead.html
    parts:
      body: |
        # Design

        How this workspace looks is decided here. It ships in Biom's own colours — charcoal, cream and one sunflower — and to change it you tell your agent the feel you want, in your own words. Scroll: _these are three of them._
  - name: default
