<!-- base/checklist/index.html — A LIST WHERE SOME ITEMS ARE DONE.

     WHAT IT DRAWS. A numbered run of ideas with a switch on each one: the switch
     is a ring until it is ticked and a filled disc with a drawn tick in it
     afterwards, a done row goes quiet and sinks, and the tally at the head reads
     how many of how many — the done count in the hot colour, which is the one
     number on the section worth looking at twice.

     WHERE THE WORDS LIVE. In `content.yaml`. `ideas` is ONE slot holding a LIST,
     one entry per idea, and a done one ends with the word — so the status is in
     the document, in words, rather than in a marker beside it. `lede` and `note`
     are the prose around it and nothing in this file is a sentence.

     WHAT TO CHANGE FIRST: `data-g-done` on the node below, then the entries. The
     MECHANISM is what to keep; the tick, the tally and the quiet done row are a
     DESIGN, and it is yours the moment this is your file.

     THE VOCABULARY IS IN THE MARKUP AND NOT IN THE PLUGIN. `data-g-done="Built"`
     below is this copy's word; a list of invoices says `Paid` and a list of
     questions says `Answered`. The plugin reads that attribute, matches it
     against each item's own last line, and writes it when somebody ticks — so
     the status lives in the document and not in a marker beside it.

     THREE PLUGINS, ONE CONCERN EACH, AND THE SECTION DECIDES WHICH IT WANTS.
     `checklist` sets `data-status` on the item — the matched word, lowercased,
     so a list with two vocabularies can be styled per word — inserts one `.dot`
     switch and draws the tally into its own node. `open-list` numbers the list
     and, by composing on `items`, brings the add and the per-item delete with
     it. A section that wants the status and no delete simply does not place the
     second node.

     ALL THREE INK NOTHING. Everything below is what their controls look like
     HERE — the ring, the tick inside it, the lit tally — and a section that
     wants something else writes something else. That is the whole of the deal: a
     plugin draws the behaviour, the section draws the look.

     NOTHING DEPENDS ON WHICH PLUGIN MOUNTED FIRST. Both insert at the head of an
     item, so the columns below are stated with `grid-column` rather than left to
     the order the nodes happen to be in.

     THE NUMBER IS A CSS COUNTER AND IS NEVER TYPED, so it renumbers itself when
     an item is added, deleted or moved. A number written into the document is
     right until the moment the list changes.

     THE TALLY IS DRAWN INTO THE PLUGIN'S OWN NODE. Where that node sits is where
     the count sits. -->
<style>
  :scope { display: block; padding-block: 2.5rem; }

  .wrap {
    display: grid;
    gap: 1.25rem;
    max-inline-size: 60rem;
    margin-inline: auto;
    padding-inline: 1.25rem;
    font-family: var(--sheet-face);
    color: var(--ink);
    line-height: 1.55;
  }
  .wrap > * > :first-child { margin-block-start: 0; }
  .wrap > * > :last-child { margin-block-end: 0; }

  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }

  /* THE TALLY, DRAWN AS A GAUGE. The plugin writes `<b>done</b>` and the rest
     beside it, so the two halves can be set differently: the count in the hot
     colour because it is the number somebody is actually reading, and what it is
     out of quietly behind it. */
  .count {
    display: inline-flex;
    align-items: baseline;
    gap: .25rem;
    padding: .25rem .6rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: color-mix(in srgb, var(--stock-hi) 60%, transparent);
    font-family: var(--gauge-face);
    font-size: .8rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .count b { font-size: 1.15rem; line-height: 1; color: var(--cyan-t); }

  /* THE SLOT IS THE LIST AND ITS CHILDREN ARE THE ITEMS. `> *` is every item
     there will ever be, so nothing here has to know how many that is. */
  [data-g-part="ideas"] { display: grid; counter-reset: idea; }

  [data-g-part="ideas"] > * {
    display: grid;
    grid-template-columns: 1.15rem 1.6rem minmax(0, 1fr) auto;
    column-gap: .75rem;
    align-items: start;
    counter-increment: idea;
    padding-block: .8rem;
    border-block-start: 1px solid var(--rule);
    opacity: 0;
    translate: 0 .5rem;
    transition: opacity calc(400ms * var(--motion, 1)) ease,
                translate calc(460ms * var(--motion, 1)) cubic-bezier(.16, 1, .3, 1),
                color calc(200ms * var(--motion, 1)) ease;
  }

  /* AND THE CLASS THE `reveal` PLUGIN ADDS. It is already on the section by the
     time an idea added from the page is drawn, so a new row arrives finished
     rather than invisible. */
  :scope.is-seen [data-g-part="ideas"] > * { opacity: 1; translate: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-g-part="ideas"] > * { opacity: 1; translate: none; }
  }
  [data-g-part="ideas"] > * > :first-child { margin-block-start: 0; }
  /* AND THE FIRST WORD BLOCK IS THE THIRD CHILD, because both plugins insert at
     the head of an item — whichever of them mounted last. Without this the
     heading an item opens with keeps the space the type scale puts ABOVE a
     heading, and the words sit a line below the switch that belongs to them.
     Stated against a position rather than a class, because it is a fact about
     where the words are and not about what they are. */
  [data-g-part="ideas"] > * > :nth-child(3) { margin-block-start: 0; }
  [data-g-part="ideas"] > *:has(> .bar) > :nth-last-child(2) { margin-block-end: 0; }
  /* The words are the third column and everything the plugin inserted is beside
     them, so an item's markdown never has to know it is in a checklist. */
  [data-g-part="ideas"] > * > .dot { grid-column: 1; }
  [data-g-part="ideas"] > * > .ord { grid-column: 2; }
  [data-g-part="ideas"] > * > .bar { grid-column: 4; }
  [data-g-part="ideas"] > * > :not(.dot):not(.ord):not(.bar) { grid-column: 3; }

  .ord::before { content: counter(idea, decimal-leading-zero); }
  [data-g-part="ideas"] .ord { font-family: var(--gauge-face); font-size: .74rem; line-height: 1.7; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* A DONE ITEM IS QUIETER AND SINKS, and the sinking is the plugin's — it
     splices the entry to the end of the array — so this only has to say what
     quieter means. */
  [data-g-part="ideas"] > *[data-status] { color: var(--ink-3); }

  /* THE SWITCH, AND THE TICK INSIDE IT. A ring while the idea is open; filled in
     the hot colour once it is done, with a tick drawn out of two borders on a
     turned box — no picture file and no icon font, so it takes the palette like
     everything else. */
  .dot {
    position: relative;
    inline-size: 1.15rem; block-size: 1.15rem; margin-block-start: .15rem;
    padding: 0; border: 1px solid var(--ink-3); border-radius: 50%;
    background: transparent; cursor: pointer;
    transition: background calc(180ms * var(--motion, 1)) ease,
                border-color calc(180ms * var(--motion, 1)) ease;
  }
  .dot:hover { border-color: var(--cyan); }
  .dot::before {
    content: "";
    position: absolute;
    inset-block-start: .25rem;
    inset-inline-start: .35rem;
    inline-size: .2rem;
    block-size: .4rem;
    border: 2px solid var(--on-spot);
    border-block-start: 0;
    border-inline-start: 0;
    rotate: 45deg;
    opacity: 0;
    transition: opacity calc(180ms * var(--motion, 1)) ease;
  }
  .dot[aria-checked="true"] { background: var(--cyan); border-color: var(--cyan); }
  .dot[aria-checked="true"]::before { opacity: 1; }

  .bar { display: flex; justify-content: flex-end; margin: 0; visibility: hidden; }
  [data-g-part="ideas"] > *:hover .bar,
  [data-g-part="ideas"] > *:focus-within .bar { visibility: visible; }
  @media (hover: none) { .bar { visibility: visible; } }

  .btn, .add {
    font-family: var(--furniture-face);
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }
  .btn { padding: 0 .35rem; font-size: .7rem; line-height: 1.6; border-radius: 2px; background: var(--stock-hi); }
  /* THE ADD IS A REAL CONTROL AND LOOKS LIKE ONE. */
  .add {
    justify-self: start;
    padding: .4rem .85rem;
    border-radius: 3px;
    background: var(--stock-hi);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .btn:hover, .add:hover { color: var(--ink); border-color: var(--ink-3); }

  [data-g-part="note"] { color: var(--ink-3); font-size: .88rem; }
</style>

<div class="wrap">
  <div class="head">
    <div data-g-part="lede"></div>
    <!-- THE TALLY, drawn into this node by the plugin. `data-g-done` is the word
         an item wears when it is done, and it is the only thing that has to
         change to make this list about something else. -->
    <span class="count" data-g-plugin="biom-checklist" data-g-for="ideas" data-g-done="Built"></span>
  </div>
  <div data-g-part="ideas"></div>
  <!-- THE NUMBER, THE ADD AND THE DELETE. `open-list` composes on `items`, so
       one node brings all three: an `.ord` per item for the counter above to
       fill, a `.bar` with a delete in it, and the add button drawn here. -->
  <span data-g-plugin="biom-open-list" data-g-for="ideas" data-g-add="＋ Another idea"></span>
  <!-- ONE CLASS, ONCE, ON THIS SECTION, and the observer disconnects after it. -->
  <span data-g-plugin="biom-reveal"></span>
  <div data-g-part="note"></div>
</div>
