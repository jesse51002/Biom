name: Figure beside prose
plugin: doc
contents:
  - name: how-to-use-this
    parts:
      body: |
        Copy `index.html` beside a page's `content.yaml` — `figure.html` is the obvious name — and
        paste the section below into that page's `contents` with `data:` changed to match. Or copy
        this whole directory into `pages/<parent>/children/<name>/` and it draws as it stands.

        The picture is held while the prose scrolls past it, and it is released where this section
        ends: sticky only pins inside its own containing block. That is why the figure and the
        argument are ONE section rather than two.

        **The figure is a drawing and not a photograph.** A row of counts over a row of bars, in
        HTML, on the palette's tokens, growing once when the section is first seen — which is what a
        figure is here. Its words and its numbers are the section's `variables`, as parallel lists,
        so changing the drawing is changing the document.
  - name: spread
    data: index.html
    variables:
      kpiName:
        - Trays potted on
        - Trays lost
        - Trays given away
      kpiValue:
        - 17
        - 4
        - 9
      barName:
        - Feb
        - Mar
        - Apr
        - May
        - Jun
      barValue:
        - 12
        - 19
        - 34
        - 26
        - 15
    parts:
      body: |
        ## What the section can do that the document could not

        A section is a div. It is full width, it owns its layout entirely, and the reading measure
        lives inside the default section's own file rather than on the sheet — so a band that goes
        edge to edge costs nothing, and a column that wants 34rem of measure asks for it here.

        > Prose still wants a measure. A page that is edge to edge everywhere is exactly as
        > monotonous as one that is 34rem everywhere.

        The freedom is to choose per section. Two columns where a figure earns its place beside the
        argument; one column where the words are the whole of it; a grid where things are being
        compared. A page that chooses the same shape every time has not used any of it.

        Swap this slot's prose for the real argument, and swap `kpiName`, `kpiValue`, `barName` and
        `barValue` for the real figures. The tallest bar lights itself, so nothing here has to be
        told which one matters.
      caption: |
        _A number per bar cannot live in a list slot — a slot holds markdown, and reading a figure
        back out of prose is parsing — so the figures are `variables`, edited on this page's config
        screen rather than on the page. Every count here is invented._
      fault: |
        _This figure has no numbers yet. Add `kpiName` and `kpiValue`, or `barName` and `barValue`,
        to the section's `variables` — one entry each per count — and the drawing appears._
