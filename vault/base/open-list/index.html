<!-- base/open-list/index.html — A NUMBERED LIST WHERE NOTHING HOLDS.

     WHAT IT DRAWS. A numbered run of open questions: each number in a drawn
     medallion, the rows arriving together when the section is first seen, and
     the one at the head lit in the hot colour because the top of a list a reader
     can drag is the one they said was next.

     WHERE THE WORDS LIVE. In `content.yaml`. `questions` is ONE slot holding a
     LIST — one entry per question — with `lede` and `note` around it. Nothing in
     this file is a sentence.

     WHAT TO CHANGE FIRST: the entries under `questions:`, then the mark, which
     is one rule. The MECHANISM is what to keep: one slot, a counter rather than
     a typed number, and the harness that writes the array back.

     NO STATUS IS READ OFF AN ENTRY, and that is the point. Every question is
     equally open, so the only thing a colour can honestly mean here is WHICH ONE
     IS NEXT — which is position, and position is computed. A list where some
     items are done is the `checklist` plugin and a different section.

     THE NUMBER IS A CSS COUNTER AND IS NEVER TYPED. The plugin puts an empty
     `.ord` at the head of each item and the three rules below fill it, so the
     list renumbers itself on an add, a delete or a move. A number written into
     the document is right until the moment the list changes.

     THE MARK IS DECIDED IN ONE RULE. `content: counter(q, decimal-leading-zero)`
     is a number; `content: "☐"` is an open square; `content: "—"` is a dash.
     Whichever it is, it is decided once, here, rather than argued out again in
     every file that has a list on it. The medallion around it is a design and is
     yours to replace; the counter inside it is the part to keep.

     AND THE LIT ONE IS `:first-child`, NEVER A CLASS AND NEVER A WORD TYPED INTO
     AN ITEM. A reader can drag any entry of a list slot anywhere in it, so
     dragging a question to the top MAKES it the next one — which is exactly what
     they meant by dragging it there. Written the other way round, dragging
     produces a page with two nexts or none, and nothing on screen says so.

     `open-list` COMPOSES ON `items`, so this one node brings the add and the
     per-item delete with it. There is no second door for those and no copy of
     them in this file. -->
<style>
  :scope { display: block; padding-block: 2.5rem; }

  .wrap {
    display: grid;
    gap: 1.25rem;
    max-inline-size: 60rem;
    margin-inline: auto;
    padding-inline: 1.25rem;
    font-family: var(--sheet-face);
    color: var(--ink);
    line-height: 1.55;
  }
  .wrap > * > :first-child { margin-block-start: 0; }
  .wrap > * > :last-child { margin-block-end: 0; }

  /* THE SLOT IS THE LIST AND ITS CHILDREN ARE THE ITEMS. `> *` is every item
     there will ever be, so nothing here has to know how many that is. */
  [data-g-part="questions"] { display: grid; counter-reset: q; }

  [data-g-part="questions"] > * {
    display: grid;
    grid-template-columns: 1.9rem minmax(0, 1fr) auto;
    column-gap: .85rem;
    align-items: start;
    counter-increment: q;
    padding-block: .85rem;
    border-block-start: 1px solid var(--rule);
    opacity: 0;
    translate: 0 .5rem;
    transition: opacity calc(400ms * var(--motion, 1)) ease,
                translate calc(460ms * var(--motion, 1)) cubic-bezier(.16, 1, .3, 1);
  }

  /* AND THE CLASS THE `reveal` PLUGIN ADDS. It is already on the section by the
     time a question added from the page is drawn, so a new row arrives finished
     rather than invisible. */
  :scope.is-seen [data-g-part="questions"] > * { opacity: 1; translate: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-g-part="questions"] > * { opacity: 1; translate: none; }
  }
  [data-g-part="questions"] > * > :first-child { margin-block-start: 0; }
  /* AND THE FIRST WORD BLOCK IS THE SECOND CHILD, because the plugin inserts the
     number at the head of the item. Without this a question that opens with a
     heading keeps the space the type scale puts ABOVE one, and the words sit a
     line below the number that belongs to them. */
  [data-g-part="questions"] > * > :nth-child(2) { margin-block-start: 0; }
  [data-g-part="questions"] > *:has(> .bar) > :nth-last-child(2) { margin-block-end: 0; }
  [data-g-part="questions"] > * > .ord { grid-column: 1; }
  [data-g-part="questions"] > * > .bar { grid-column: 3; }
  [data-g-part="questions"] > * > :not(.ord):not(.bar) { grid-column: 2; }

  /* THE MARK, IN A MEDALLION DRAWN HERE. One rule decides what the mark IS and
     the block around it decides what it looks like — a ring, a square, nothing
     at all. */
  [data-g-part="questions"] .ord {
    display: grid;
    place-items: center;
    inline-size: 1.9rem;
    block-size: 1.9rem;
    border: 1px solid var(--rule);
    border-radius: 50%;
    font-family: var(--gauge-face);
    font-size: .72rem;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  [data-g-part="questions"] .ord::before { content: counter(q, decimal-leading-zero); }

  /* THE NEXT ONE UP IS THE FIRST ONE, and it is the only thing here wearing the
     hot colour — a list where every row is lit has lit nothing. */
  [data-g-part="questions"] > :first-child .ord {
    border-color: var(--cyan);
    color: var(--on-spot);
    background: var(--cyan);
  }

  .bar { display: flex; justify-content: flex-end; margin: 0; visibility: hidden; }
  [data-g-part="questions"] > *:hover .bar,
  [data-g-part="questions"] > *:focus-within .bar { visibility: visible; }
  @media (hover: none) { .bar { visibility: visible; } }

  .btn, .add {
    font-family: var(--furniture-face);
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }
  .btn { padding: 0 .35rem; font-size: .7rem; line-height: 1.6; border-radius: 2px; background: var(--stock-hi); }
  /* THE ADD IS A REAL CONTROL AND LOOKS LIKE ONE: it is the thing a reader has
     to find without being told it is there. */
  .add {
    justify-self: start;
    padding: .4rem .85rem;
    border-radius: 3px;
    background: var(--stock-hi);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .btn:hover, .add:hover { color: var(--ink); border-color: var(--ink-3); }

  [data-g-part="note"] { color: var(--ink-3); font-size: .88rem; }
</style>

<div class="wrap">
  <div data-g-part="lede"></div>
  <div data-g-part="questions"></div>
  <!-- THE NUMBER, THE ADD AND THE DELETE, from one node. -->
  <span data-g-plugin="open-list" data-g-for="questions" data-g-add="＋ Another question"></span>
  <!-- ONE CLASS, ONCE, ON THIS SECTION, and the observer disconnects after it. -->
  <span data-g-plugin="reveal"></span>
  <div data-g-part="note"></div>
</div>
