<!-- base/list/index.html — A SLOT THAT HOLDS A LIST.

     WHAT IT DRAWS. A row of cards a reader can add to, delete from and drag
     around: each one on its own plate with a drawn mark at its head, the mark
     and the plate's leading edge lighting in the one hot colour under the
     pointer or the keyboard, and the whole row arriving once when the section is
     first seen.

     WHERE THE WORDS LIVE. Every one of them in `content.yaml`. `items` is ONE
     slot holding a LIST — one entry per card, markdown each — and `lede` and
     `note` are the prose around it. Nothing in this file is a sentence.

     WHAT TO CHANGE FIRST: the entries under `items:`, and then the look. The
     MECHANISM is the part to keep when you copy — one slot, one element per
     entry, the harness that writes the array back — and the plate, the mark and
     the lit edge are a DESIGN, which is yours the moment this is your file.
     `design/` is whose taste decides that, not this one.

     THERE IS NO NUMBER IN THIS FILE, AND THAT IS THE POINT. The items are ONE
     slot holding a LIST, so a fourth item is a fourth entry in `content.yaml` —
     or the button this section draws for itself — and never an edit to this
     markup. A section that named `one`, `two` and `three` as three slots could
     hold three things forever, at a number nobody chose, and every page copied
     from it inherited the ceiling.

     AN ITEM IS AN ELEMENT, so there is nothing to parse and nothing to agree
     about. The runtime draws one element per item into the slot, in order, each
     one a `<div data-g-item="0">`, `…="1">` and so on holding that item's own
     rendered markdown — which is why the layout below is written as `> *`.

     ADD AND REMOVE ARE THE `items` PLUGIN AND NOT A SCRIPT IN THIS FILE, and
     that is the rule rather than a convenience: a drawing with even a small
     chance of being wanted on another page is a plugin from the start. This one
     was written into 88 section files in one workspace, in eleven different
     shapes. There is nothing in it but array work — read, splice, write the
     whole array back — so the page redraws itself from what was stored and
     nothing re-renders an item it just changed.

     REORDERING IS NOT THERE EITHER, and nothing else draws it: the runtime puts
     no grip on an item, because nothing is drawn over a page. Moving one is the
     same splice through the same door, so a list that wants it adds the control
     in its own section script.

     NOTHING IS STYLED BY A CLASS THIS FILE INVENTED. The slots are styled
     through `data-g-part`, which is the name the document already uses, so there
     is no second vocabulary to learn, nothing to keep in step, and nothing
     arbitrary for the next page to copy. -->
<style>
  :scope { display: block; padding-block: 2.5rem; }

  .wrap {
    display: grid;
    gap: 1.25rem;
    max-inline-size: 60rem;
    margin-inline: auto;
    padding-inline: 1.25rem;
    font-family: var(--sheet-face);
    color: var(--ink);
    line-height: 1.55;
  }
  .wrap > * > :first-child { margin-block-start: 0; }
  .wrap > * > :last-child { margin-block-end: 0; }

  /* THE SLOT IS THE GRID AND ITS CHILDREN ARE THE ITEMS. `> *` is every item
     there will ever be, so the layout never has to know how many that is — and
     there is no class to keep in step with a script, because the element the
     rule paints is the element the runtime drew.

     `min()` ON THE FLOOR, or the track cannot shrink below 14rem and the grid
     overflows a narrow canvas instead of collapsing to one column. `auto-fit`
     removes empty tracks; it does not let a full one get smaller than its
     minimum. Hit by an agent building on this file. */
  [data-g-part="items"] {
    display: grid;
    gap: 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr));
    align-items: start;
  }

  /* AN ITEM IS A PLATE WITH A MARK ON IT. The mark is drawn — a small square
     turned on its corner, in the palette's own ink — and it is positioned rather
     than laid out, so it never takes a row of the item's own grid and the words
     inside an item stay ordinary markdown that knows nothing about being in a
     list.

     IT ARRIVES WITH THE ROW AND IT LIGHTS UNDER THE POINTER. Everything about
     how that looks is here; what is NOT negotiable is that the item is `> *` and
     nothing in this file knows how many there are. */
  [data-g-part="items"] > * {
    position: relative;
    display: grid;
    gap: .4rem;
    align-content: start;
    min-inline-size: 0;
    padding: .75rem .9rem .8rem 1.6rem;
    border: 1px solid var(--rule);
    border-inline-start: 2px solid var(--rule);
    border-radius: 3px;
    background: color-mix(in srgb, var(--stock-hi) 55%, transparent);
    opacity: 0;
    translate: 0 .6rem;
    transition: opacity calc(420ms * var(--motion, 1)) ease,
                translate calc(480ms * var(--motion, 1)) cubic-bezier(.16, 1, .3, 1),
                border-color calc(160ms * var(--motion, 1)) ease;
  }

  /* THE MARK. Two lengths and a rotation, so there is no picture file and no
     icon font — and it takes `--ink-3` until the item is reached, which is the
     one hot colour spent on the one item somebody is looking at. */
  [data-g-part="items"] > *::before {
    content: "";
    position: absolute;
    inset-block-start: 1.05rem;
    inset-inline-start: .72rem;
    inline-size: .4rem;
    block-size: .4rem;
    background: var(--ink-3);
    rotate: 45deg;
    transition: background calc(160ms * var(--motion, 1)) ease;
  }
  [data-g-part="items"] > *:hover,
  [data-g-part="items"] > *:focus-within { border-inline-start-color: var(--cyan); }
  [data-g-part="items"] > *:hover::before,
  [data-g-part="items"] > *:focus-within::before { background: var(--cyan); }

  /* AND THE CLASS THE `reveal` PLUGIN ADDS. It is already on the section by the
     time a card added from the page is drawn, so a new item arrives finished
     rather than invisible — which is the whole reason the resting state is
     written here and the arrival is written under `is-seen`. */
  :scope.is-seen [data-g-part="items"] > * { opacity: 1; translate: none; }

  /* A READER WHO ASKED FOR LESS MOTION GETS THE LIST AND NOT THE MOVE. The
     durations are already nothing through `--motion`; this is the half a
     multiplier cannot do, which is putting the ink back. */
  @media (prefers-reduced-motion: reduce) {
    [data-g-part="items"] > * { opacity: 1; translate: none; }
  }
  [data-g-part="items"] > * > :first-child { margin-block-start: 0; }
  [data-g-part="items"] > * > :last-child { margin-block-end: 0; }
  /* THE CONTROL BAR IS APPENDED LAST, so `:last-child` above lands on it rather
     than on the words. The one before it is the one to flatten. */
  [data-g-part="items"] > *:has(> .bar) > :nth-last-child(2) { margin-block-end: 0; }

  /* Anything wide inside an item scrolls in its own box rather than pushing the
     item out — a long unbroken string is the ordinary case. */
  [data-g-part="items"] :is(pre, table) { max-inline-size: 100%; overflow-x: auto; }

  [data-g-part="note"] { color: var(--ink-3); font-size: .88rem; }

  /* AN ITEM'S CONTROLS ARE QUIET BY CSS AND NOT BY SCRIPT, so nothing has to be
     told when the pointer moves. They HOLD THEIR SPACE — the item does not jump
     when they appear — and `visibility` rather than `opacity` alone is what
     stops an invisible ✕ from taking a click. `:focus-within` keeps them
     reachable by tab, and a touch screen has no hover at all, so there they
     simply stay up.

     `flex-end` puts them at the item's far edge, away from the words they sit
     beside. */
  .bar {
    /* ON THE ITEM'S TOP CORNER, where it cannot cover the item's first words —
       which is what the item's own `position: relative` above is for. */
    position: absolute;
    inset-block-start: .3rem;
    inset-inline-end: .3rem;
    display: flex; justify-content: flex-end; margin: 0;
    visibility: hidden; opacity: 0;
    transition: opacity 120ms ease;
  }
  [data-g-part="items"] > *:hover .bar,
  [data-g-part="items"] > *:focus-within .bar { visibility: visible; opacity: 1; }
  @media (hover: none) { .bar { visibility: visible; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }

  /* ADD NEVER HIDES. It is the one control that is not about an item that
     already exists, so there is nothing for it to appear over — and somewhere to
     write next is the thing a page should never make you hunt for.

     THE LOOK IS THIS FILE'S AND THE BEHAVIOUR IS THE PLUGIN'S. `items` inserts
     `.add`, `.bar` and `.btn` and inks none of them, so every rule about how
     they look is here, where a section can disagree with it. */
  .add-here { display: block; }
  .btn, .add {
    font-family: var(--furniture-face);
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }
  .btn { padding: 0 .35rem; font-size: .7rem; line-height: 1.6; border-radius: 2px; background: var(--stock-hi); }
  /* THE ADD IS A REAL CONTROL AND LOOKS LIKE ONE: the furniture role, in the
     workspace's own chrome, because it is the one thing on the section a reader
     has to find without being told it is there. */
  .add {
    justify-self: start;
    padding: .4rem .85rem;
    border-radius: 3px;
    background: var(--stock-hi);
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .btn:hover, .add:hover { color: var(--ink); border-color: var(--ink-3); }
</style>

<div class="wrap">
  <div data-g-part="lede"></div>
  <!-- ONE SLOT, AND NO ITEM INSIDE IT. Every item this section will ever hold is
       an entry in the list behind this one id. -->
  <div data-g-part="items"></div>
  <!-- THE HARNESS IS A PLUGIN AND NOT A SCRIPT IN THIS FILE. the `items` plugin
       reads the array, splices it and writes it whole, and puts the controls back
       after a redraw — the same code every list in every workspace needs, with no
       design content in it at all. The ADD control is drawn into THIS node, so
       where the node sits is where the button sits. -->
  <span class="add-here" data-g-plugin="items" data-g-for="items" data-g-add="＋ Another item"></span>
  <!-- ONE CLASS, ONCE, ON THIS SECTION, and the observer disconnects after it.
       The row arrives when it is first seen rather than at load, so a reader who
       scrolls down to this section watches it arrive instead of finding it
       already still. -->
  <span data-g-plugin="reveal"></span>
  <div data-g-part="note"></div>
</div>
