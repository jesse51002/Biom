<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Map</title>
    <!-- The runtime's own tags are spliced in by the host, the same way they are
         for every page; this document names only what is its own.

         ITS SCRIPT IS NOT NAMED HERE. `mindmap.js` beside this file is in the
         bundle every page in the vault carries, because every plugin folder's
         scripts are — one tag, woven by the host — and it draws only where
         `#g-map` is on the page. A `data-g-src` naming it as well would run it
         twice. -->
  </head>
  <body><main id="g-map"></main></body>
</html>
