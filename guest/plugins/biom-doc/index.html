<!doctype html>
<meta charset="utf-8">
<!--
  guest/plugins/biom-doc/index.html — THE DOCUMENT, and it is nearly nothing.

  A doc page is a stack of sections, and the runtime already knows how to draw
  one: it reads `contents`, resolves each section's markup, fills its slots and
  hands them to the edit wave. So most of this file's job is to be the page the
  runtime draws INTO — a document that had a layout of its own would be a second
  opinion about the shape of every document in every workspace, decided once,
  here, by whoever wrote this file.

  THE RUNTIME IS NOT LISTED HERE. `client/platform/document.js` splices the
  vendor, runtime and plugin tags into the head of whatever document draws a
  page, so a plugin author writes their page and gets the box's furniture for
  free — and there is one list of those scripts rather than one per document,
  which is one list that can go stale rather than several that disagree.

  THE INK IS NOT HERE ANY MORE, AND ITS ABSENCE IS THE POINT. This file used to
  declare it — the shim writes the palette on :root as custom properties and
  nothing else, a browser's default text colour is black, and that is an
  unreadable page the moment a workspace ships light ink on a dark board — but
  saying it HERE meant only a `doc` page read correctly. The design doc, whose
  box is woven with no document at all, drew its title in black on charcoal on a
  brand-new vault, and so did any page an author wrote without thinking to say
  `color: var(--ink)`. It is `INK` in `client/frame/frame.js` now, woven into
  every box the host makes, in `@layer biom.ink` so a section, a plugin document
  and a page somebody wrote all still beat it by existing.

  THE FIGURE FRAME, WHICH IS FOUR RULES WITH NO LOOK IN THEM — a motion switch,
  a centred wrap, the pair that flattens a slot's outer margins, and the reading
  measure. Every one of them was being re-declared by hand at the top of almost
  every section that draws anything. In the workspace this was measured in, the
  reduced-motion pair was in 176 section files, the measure in 167, the flatten
  pair in 136 and the wrap in 122 — AND THE FOUR DID NOT APPEAR TOGETHER, so
  some sections had part of the frame and not the rest. That drift is what a
  document stylesheet is for: a rule here genuinely reaches a section, where a
  section's own `<style>` — wrapped in `@scope (#sec-<name>)` — reaches only
  itself. It is a DEFAULT AND NEVER A CEILING, and `@layer` is what makes that
  true rather than a hope: an unlayered author rule beats every layered one
  whatever its specificity, so a section's own `<style>` wins by existing.

  TWO NODES OF ITS OWN, AND WHAT EACH ONE NAMES. `<header id="g-head">` sits
  before the stack and `<footer id="g-foot">` after it, both drawn empty. Once
  the runtime has drawn the stack for the first time, the first script below
  reads this document's own variables — `head` and `foot`, declared with their
  defaults in `plugin.yaml` beside this file, and merged by the server with the
  vault's `plugins/biom-doc/extensions.yaml` and the page's own, nearest rung
  winning one key at a time — and mounts the plugin each names into its node
  exactly as a section mounts a `data-g-plugin` node: the same context, the
  same containment, so a plugin that throws fails in its node in words and the
  stack draws. THAT IS THE DOCUMENT READING TWO OF ITS OWN VARIABLES, NOT A
  FRAMEWORK FEATURE: the runtime has no notion of a point, and a plugin that
  wants extending draws a node and reads a variable. It happens once per box —
  a section edit redraws the stack and not the document, and a change on disk
  tears the whole box down — so nothing mounts twice and nothing leaks.

  THE BOARD OF CHILDREN IS `foot: biom-holds`, and it is the one line that puts
  the board under every document. The board itself is `plugins/holds/holds.js`
  inside this folder, registering `biom-holds` — markup, sort, tally, rows and
  the `holds`/`holdWords` reading, off `biom.children()` and `biom.data()` —
  because it is a thing that DRAWS, and everything that draws is a plugin. So a
  vault swaps it with `foot: my-board` and a plugin called `my-board`, drops it
  with `foot:` left empty, dresses it with a plugin named at `head` that adds
  a stylesheet, and a section may place it — `<div data-g-plugin="biom-holds">`
  — where a gallery wants the board somewhere other than the bottom.

  THE BOARD'S LOOK STAYS HERE, in `@layer biom.holds`, keyed on the `.g-holds`
  root the plugin draws, because a plugin inks nothing: it is a document
  stylesheet, so it reaches the board wherever on the page it is mounted, and
  an unlayered rule from anywhere beats it by existing.

  WHY THE RECONCILED SECTIONS ARE HIDDEN RATHER THAN REMOVED, AND ONLY THE ONES
  NOBODY HAS WRITTEN A FILE FOR. The host writes a `@page-<segment>` section
  into a parent's `contents` on every read, and it is right to: that
  reconciliation is what guarantees a page created in any way is never missing
  from its parent. So the entries stay, and stay authoritative — this file just
  declines to draw a bare one twice. The rule carries `[data-g-default]`, which
  the runtime sets on a section that resolved to the SHIPPED default because it
  named no file of its own: a parent that wrote `@page-notes.html` for one child
  still draws it, because they meant that row and the board is not entitled to
  overrule them. It is the DOCUMENT'S rule and not the board's: a page that
  empties `foot` and draws nothing else shows neither, and `rows: true` in a
  rung is the one line that shows the bare rows again. A rule in THIS head is a
  document stylesheet and is not `@scope`-wrapped, so unlike a section trying
  to hide a sibling it genuinely reaches them; no `!important`, and nothing is
  deleted from the DOM that the edit wave might be holding.

  AND THE CONVERSION, which is the other thing here that writes. A markdown
  table is a run of pipes inside a paragraph: drawn as a thin strip of wrapped
  sentences, edited by retyping the pipes, and impossible to add a row to
  without knowing where the row goes. So when this document has drawn a page
  and a prose part on it holds a markdown table, the table is cut out and the
  document rewritten, once, in place: the prose before keeps the section's
  name, the table becomes a section of its own whose one slot is a `grid` part
  — the rows as data, edited one cell at a time by `plugins/biom-grid.js` — and the
  prose after gets a section of its own. Nobody retypes anything. It goes
  through the RUNTIME'S port, `section.write` and `section.order`, which is
  the door a section can never reach; and it runs on a page only when that
  page is drawn, so a document nobody has opened is never touched, and a
  document with no table in any prose part is left exactly as it was. It is
  switched by this document's own `convert` variable, on by default: a page
  whose sections carry tables as SPECIMENS — the design doc's worlds, each
  drawing its own table in its own dress — says `convert: false` in its rung,
  and the vault's seeded design doc ships that line, because the first open
  of a fresh vault's design doc otherwise cut eight specimens out of the
  worlds that styled them. The script is the second one below, on its own so
  the pure half of it can be verified outside a browser.

  IT IS DELIBERATELY PLAIN, and the reason is NOT the one `base/README.md` gives
  about starters — a starter is copied and then owned, so it is free to draw, and
  those do. This one is not copied at all: it is the document every vault draws
  with, so any look in it is a look every workspace wears without choosing it.
  One hairline, no plate, no second typeface, no accent — every colour a palette
  token, so it wears `theme.json` and follows a change of palette. A workspace
  that wants the board dressed names a plugin at `head`; one that wants another
  board names it at `foot`; and neither copies this file, which is the one
  shape that stops following the framework.
-->
<html>
  <head>
    <title>Document</title>
    <style>
      /* The reconciled child sections that nobody wrote a file for. See above.
         `rows: true` in a rung puts `g-rows` on the root and shows them. */
      :root:not(.g-rows) #g-page > [id^="sec-@page-"][data-g-default],
      :root:not(.g-rows) #g-page > [id^="sec-@table-"][data-g-default] { display: none; }

      /* THE LAYER ORDER, DECLARED BEFORE ANY OF THE LAYERS EXISTS, and it is
         load bearing. `guest/runtime/scale.js` appends `@layer biom.scale` to
         this head at draw time, which makes it a LATER layer than one declared
         in this file — and a later layer beats an earlier one whatever the
         specificity, so the scale's `[data-g-md] p { margin-block: … }` was
         quietly defeating the frame's flatten pair on every page. Naming them
         here fixes the order once: the scale states the type, the frame
         flattens the outer margins the type gave, the board's look comes last,
         and an unlayered section rule still beats all three by existing. */
      @layer biom.scale, biom.frame, biom.holds;

      /* ── the figure frame ───────────────────────────────────────────────
         What every figure opens with, once. A section may stop re-declaring
         any of it, and a section that declares it anyway still wins. */
      @layer biom.frame {
        /* THE MOTION SWITCH, AS A NUMBER RATHER THAN A MEDIA QUERY PER RULE.
           A duration or a delay multiplied by `--motion` is nothing when the
           reader has asked for less, so an animation is written once and turned
           off in one place. A section that needs to remove a transform outright
           still writes its own `prefers-reduced-motion` block. */
        :root { --motion: 1; }
        @media (prefers-reduced-motion: reduce) { :root { --motion: 0; } }

        /* THE WRAP: a figure's own column, centred, at a width a figure can be
           read at — wider than prose, because a figure is not prose. The inline
           padding is what keeps it off the edge of a phone. */
        .wrap {
          display: grid;
          gap: 1rem;
          max-inline-size: 64rem;
          margin-inline: auto;
          padding-inline: 1.25rem;
          color: var(--ink);
        }

        /* THE FLATTEN PAIR. A slot's first and last block carry the margins
           markdown gives them, which fight the gap the wrap already set — so the
           outer two are dropped and the spacing between slots is the section's
           to decide. Written as `> * >` so it reaches the blocks inside a slot
           and never the slot itself. */
        .wrap > * > :first-child { margin-block-start: 0; }
        .wrap > * > :last-child { margin-block-end: 0; }

        /* THE READING MEASURE. `--md-measure` is what the workspace's
           `markdown.yaml` says prose should be read at, and 34rem is the fallback
           when it says nothing. A slot holding a table, a board or anything that
           is not prose says its own width in the section's `<style>` and wins. */
        [data-g-part] {
          inline-size: 100%;
          max-inline-size: var(--md-measure, 34rem);
          margin-inline: auto;
        }
      }

      /* ── the board of children, as `biom-holds` draws it ──────────────── */

      @layer biom.holds {
        .g-holds { display: block; container-type: inline-size; }
        .g-holds[hidden] { display: none; }

        /* THE HEAD IS THE COUNT AND THE SORT, butted against the first row
           rather than floating above it: one board, one top edge. */
        .g-holds .rail {
          display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
          max-inline-size: 64rem; margin-inline: auto; padding: .55rem 1.25rem;
          border-block-end: 1px solid var(--rule);
        }
        .g-holds .tally {
          display: inline-flex; align-items: baseline; gap: .4rem;
          font-size: .8rem; color: var(--ink-2);
        }
        .g-holds .tally b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
        .g-holds .sort { display: inline-flex; align-items: baseline; gap: .1rem; }
        .g-holds .sort button {
          background: none; border: 0; padding: .15rem .45rem; cursor: pointer;
          font: inherit; font-size: .76rem; color: var(--ink-3);
        }
        .g-holds .sort button:hover { color: var(--ink-2); }
        .g-holds .sort button[aria-pressed="true"] { color: var(--ink); }
        .g-holds .sort button[hidden] { display: none; }

        .g-holds .row {
          display: grid;
          grid-template-columns: 2.25rem minmax(9rem, 1fr) auto auto minmax(0, 1.6fr);
          grid-template-areas: "ord name stamp kind blurb";
          column-gap: 1rem; align-items: baseline;
          inline-size: 100%; max-inline-size: 64rem; margin-inline: auto;
          padding: .7rem 1.25rem;
          background: none; border: 0;
          border-block-end: 1px solid var(--rule-soft);
          color: var(--ink); font: inherit; text-align: left; cursor: pointer;
        }
        /* ONE PASS, ON FIRST SIGHT, AND THEN IT RESTS — and `--motion` is the
           frame's switch, so a reader who has asked for less motion gets none. */
        .g-holds.is-seen .row {
          animation: g-holds-in calc(200ms * var(--motion, 1)) ease-out both;
          animation-delay: calc(var(--i, 0) * 40ms * var(--motion, 1));
        }
        @keyframes g-holds-in { from { opacity: 0; } to { opacity: 1; } }

        .g-holds .ord { grid-area: ord; color: var(--ink-3); font-size: .8rem; font-variant-numeric: tabular-nums; }
        .g-holds .name { grid-area: name; color: var(--ink); line-height: 1.35; min-inline-size: 0; overflow-wrap: anywhere; }
        .g-holds .stamp { grid-area: stamp; color: var(--ink-3); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .g-holds .stamp:empty { display: none; }
        .g-holds .kind { grid-area: kind; color: var(--ink-3); font-size: .78rem; white-space: nowrap; }
        .g-holds .blurb { grid-area: blurb; color: var(--ink-2); font-size: .92rem; line-height: 1.45; min-inline-size: 0; }
        .g-holds .blurb:empty { display: none; }

        .g-holds .row:hover .name, .g-holds .row:focus-visible .name { color: var(--cyan); }
        .g-holds :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

        /* A CONTAINER QUERY AND NOT A MEDIA QUERY: the board is as wide as the
           pane it is in, which is not the width of the canvas. */
        @container (width <= 52rem) {
          .g-holds .row {
            grid-template-columns: 2.25rem minmax(0, 1fr) auto;
            grid-template-areas: "ord name stamp" ". blurb kind";
            row-gap: .2rem;
          }
        }
        @container (width <= 30rem) {
          .g-holds .row {
            grid-template-columns: 2.25rem minmax(0, 1fr);
            grid-template-areas: "ord name" ". stamp" ". kind" ". blurb";
            row-gap: .2rem;
          }
        }
      }
    </style>
  </head>
  <body>
    <header id="g-head"></header>
    <main id="g-page"></main>
    <footer id="g-foot"></footer>

    <!-- WHAT `head` AND `foot` NAME, mounted once the stack has drawn. See the
         head of this file. -->
    <script>
      (function () {
        "use strict";

        /* THE RUNTIME'S OWN NAMESPACE. `rt.page.mount` is the runtime mounting
           a registered plugin into a node of this document's own — this
           document is the page the runtime draws into, not a section drawn on
           it, which is why it may reach it. A closure and not a browser
           guarantee, as the runtime says of itself. */
        var glob = /** @type {any} */ (globalThis);
        var rt = glob.__gRuntime || (glob.__gRuntime = {});

        var nodes = { head: document.getElementById("g-head"), foot: document.getElementById("g-foot") };
        var done = false;

        /* ONE VARIABLE, ONE NODE, ONE PLUGIN. Empty is a value and mounts
           nothing; a list where a name goes is said in the node; a name that is
           not an id, or that nothing registered, is the runtime's refusal in
           the same node, listing what is registered. Nothing is ever a blank. */
        function place(key) {
          var node = nodes[key];
          if (!node) return;
          var held = biom.plugin.extensions();
          var value = held[key];
          if (value === undefined || value === null || value === "") { node.hidden = true; return; }
          if (typeof value !== "string") {
            rt.sections.fail(node, key + " holds a " + (Array.isArray(value) ? "list" : typeof value) + " where a plugin name goes");
            return;
          }
          node.hidden = false;
          rt.page.mount(node, value.trim());
        }

        function mount() {
          if (done) return;
          done = true;
          var held = biom.plugin.extensions();
          if (held.rows === true) document.documentElement.classList.add("g-rows");
          place("head");
          place("foot");
        }

        if (rt.page && typeof rt.page.onDraw === "function") rt.page.onDraw(mount);
      })();
    </script>

    <!-- THE CONVERSION. A markdown table found in a prose part becomes a grid
         section, once, in place. See the head of this file. -->
    <script>
      (function () {
        "use strict";

        /* THE RUNTIME'S OWN NAMESPACE, which carries the privileged page
           surface — `rt.page.write` and `rt.page.order` go down the runtime's
           port. This document is the page the runtime draws into, not a
           section drawn on it, which is why it may reach them; a section is
           handed `biom` and cannot. That is a closure and not a browser
           guarantee, and it says so in the runtime. */
        var glob = /** @type {any} */ (globalThis);
        var rt = glob.__gRuntime || (glob.__gRuntime = {});

        /* ── finding a table ─────────────────────────────────────────────── */

        var FENCE = /^\s{0,3}(```|~~~)/;
        var DELIM_CELL = /^\s*:?-+:?\s*$/;

        /* The cells of one table line: split on a pipe that is not escaped,
           the outer pipes dropped, `\|` read as the character it escapes.
           A pipe inside a `[[wikilink|alias]]` or a `code span` is that
           cell's — a link with an alias is the one form this workspace
           writes, and a table reader that cut it in half would turn every
           aliased link in a table into two broken cells. Nothing else in a
           cell is touched — a cell is markdown. */
        function cellsOf(line) {
          var out = [], cur = "", i = 0, t = line.trim();
          if (t.charAt(0) === "|") t = t.slice(1);
          if (t.charAt(t.length - 1) === "|" && t.charAt(t.length - 2) !== "\\") t = t.slice(0, -1);
          for (; i < t.length; i++) {
            var ch = t.charAt(i);
            if (ch === "\\" && t.charAt(i + 1) === "|") { cur += "|"; i++; continue; }
            if (ch === "[" && t.charAt(i + 1) === "[") {
              var close = t.indexOf("]]", i + 2);
              if (close >= 0) { cur += t.slice(i, close + 2); i = close + 1; continue; }
            }
            if (ch === "`") {
              var tick = t.indexOf("`", i + 1);
              if (tick >= 0) { cur += t.slice(i, tick + 1); i = tick; continue; }
            }
            if (ch === "|") { out.push(cur.trim()); cur = ""; continue; }
            cur += ch;
          }
          out.push(cur.trim());
          return out;
        }

        /* A delimiter row carries a pipe as the header does. Without that a
           `---` under a line that happens to end in a pipe — a setext heading,
           a rule — reads as a one-column table and the heading is cut out. */
        function isDelimiter(line) {
          if (line.indexOf("-") < 0 || line.indexOf("|") < 0) return false;
          var cells = cellsOf(line);
          return cells.length > 0 && cells.every(function (c) { return DELIM_CELL.test(c); });
        }

        /* WHERE THE TABLES ARE in one part's markdown, as line ranges, `end`
           exclusive. A table is a header line holding a pipe, a delimiter line
           under it with the same number of cells, and every following line
           holding a pipe until a blank one — the shape every markdown reader
           agrees on. A fence is skipped whole, because a table inside a code
           block is an example of one and not one. */
        function tablesIn(md) {
          var lines = String(md).split("\n");
          var found = [], fence = null, i = 0;
          for (; i < lines.length; i++) {
            var line = lines[i];
            var m = FENCE.exec(line);
            if (m) { if (fence === null) fence = m[1]; else if (m[1] === fence) fence = null; continue; }
            if (fence !== null) continue;
            if (line.indexOf("|") < 0 || i + 1 >= lines.length) continue;
            var next = lines[i + 1];
            if (!isDelimiter(next)) continue;
            var width = cellsOf(line).length;
            if (width === 0 || cellsOf(next).length !== width) continue;
            var end = i + 2;
            while (end < lines.length && lines[end].trim() !== "" && lines[end].indexOf("|") >= 0 && !FENCE.test(lines[end])) end++;
            found.push({ start: i, end: end, width: width });
            i = end - 1;
          }
          return found;
        }

        /* ONE PART, CUT AROUND ITS TABLES: prose, grid, prose, grid, prose. A
           prose segment keeps every word and loses only the blank lines that
           were there to separate it from the table; a grid segment is the
           rows, squared to the header's width the way a markdown reader
           squares them, the header first. */
        function split(md) {
          var lines = String(md).split("\n");
          var tables = tablesIn(md);
          if (tables.length === 0) return null;
          var out = [], at = 0;
          tables.forEach(function (t) {
            out.push({ kind: "prose", text: prose(lines.slice(at, t.start)) });
            var rows = lines.slice(t.start, t.end).filter(function (_, k) { return k !== 1; }).map(function (line) {
              var cells = cellsOf(line).slice(0, t.width);
              while (cells.length < t.width) cells.push("");
              return cells;
            });
            out.push({ kind: "grid", rows: rows });
            at = t.end;
          });
          out.push({ kind: "prose", text: prose(lines.slice(at)) });
          return out;
        }

        /* Prose keeps its own newlines and ends with one, the way a block
           scalar does, or is empty. */
        function prose(lines) {
          var text = lines.join("\n").replace(/^\n+/, "").replace(/\s+$/, "");
          return text === "" ? "" : text + "\n";
        }

        /* ── rewriting the document ──────────────────────────────────────── */

        var NAME = /^[a-z][a-z0-9_-]*$/;

        /* A name for a section born from another, unique on the page. */
        function nameFor(base, suffix, taken) {
          var stem = base + "-" + suffix;
          var name = stem, n = 2;
          while (taken.has(name)) { name = stem + "-" + String(n); n++; }
          taken.add(name);
          return name;
        }

        /* THE PLAN: given the drawn sections, the writes that put the prose
           before back into its slot and the whole new `contents` list — or
           null when no prose part holds a table, which is every page most of
           the time. Pure, so it can be verified outside a browser.

           A section keeps its name, its file and its other slots; the slot the
           table was in keeps the prose before it. The grid becomes
           `<name>-table` (`<name>-<slot>-table` when the slot is not `body`)
           and the prose after becomes `<name>-after`, both with no file of
           their own and both carrying the section's own variables with the
           part's own over them, so a `{{name}}` in a cell or in the prose
           after still resolves. A second table in the same part is `-table-2`
           and `-after-2`.

           THE ONE CASE THE SECTION DOES NOT KEEP ITS NAME: a bare section — no
           file, this one slot and nothing else — whose part opens with the
           table. There is no prose before to keep the name for, and a section
           left holding an empty slot is a blank band on the page, so the
           section is dropped from the list and the grid section takes its
           place. A section with a file, or with other slots, is kept whole
           even then, because the file and the slots are somebody's. */
        function plan(sections) {
          var drawn = (sections || []).filter(function (one) { return one && one.source && typeof one.name === "string"; });
          var taken = new Set(drawn.map(function (one) { return String(one.name); }));
          var writes = [], contents = [], any = false;

          drawn.forEach(function (one) {
            var name = String(one.name);
            var source = one.source;
            if (name.charAt(0) === "@" || !NAME.test(name)) { contents.push(source); return; }
            var parts = one.parts || {};
            var born = [];
            var keep = true;

            Object.keys(parts).forEach(function (slot) {
              var part = parts[slot];
              if (!part || part.kind !== "markdown" || typeof part.md !== "string") return;
              var segments = split(part.md);
              if (segments === null) return;
              any = true;
              var before = segments[0].text;
              var stem = slot === "body" ? name : name + "-" + slot;
              var bare = !source.data && Object.keys(source.parts || {}).length === 1;
              if (before === "" && bare) keep = false;
              else writes.push({ section: name, part: slot, text: before });
              /* THE SCOPES A CELL RESOLVED IN, carried over: the section's own
                 values with the part's own on top, in the order the runtime
                 merges them. A part written in the long spelling can hold
                 values of its own, and a `{{rate}}` in the prose after or in a
                 cell would draw as a hole without them. */
              var stored = (source.parts || {})[slot];
              var own = stored && typeof stored === "object" && !Array.isArray(stored) && stored.variables ? stored.variables : null;
              var vars = source.variables || own ? Object.assign({}, source.variables || {}, own || {}) : null;
              var k = 0;
              for (var i = 1; i < segments.length; i += 2) {
                k++;
                var suffix = k === 1 ? "" : "-" + String(k);
                var grid = { name: nameFor(stem, "table" + suffix, taken), parts: { body: { type: "grid", head: true, rows: segments[i].rows } } };
                if (vars) grid.variables = vars;
                born.push(grid);
                var after = segments[i + 1] ? segments[i + 1].text : "";
                if (after !== "") {
                  var rest = { name: nameFor(stem, "after" + suffix, taken), parts: { body: after } };
                  if (vars) rest.variables = vars;
                  born.push(rest);
                }
              }
            });

            if (keep) contents.push(source);
            born.forEach(function (b) { contents.push(b); });
          });

          return any ? { writes: writes, contents: contents } : null;
        }

        /* ── running it ──────────────────────────────────────────────────── */

        var busy = false;
        function convert() {
          if (busy || !rt.page || typeof rt.page.sections !== "function") return;
          /* `convert` IS THIS DOCUMENT'S OWN VARIABLE, read like `head` and
             `foot`: a page whose sections carry tables as specimens — the design
             doc's worlds — says `convert: false` in its rung and keeps them. */
          var held = glob.biom && glob.biom.plugin && typeof glob.biom.plugin.extensions === "function" ? glob.biom.plugin.extensions() : {};
          if (held.convert === false) return;
          var todo = plan(rt.page.sections());
          if (todo === null) return;
          busy = true;
          /* The prose before goes back into its slot first — a write the box
             does not redraw for — and then the list is rewritten, which comes
             back as a change to the page's shape and draws the page again
             from disk, three sections where there was one.

             ONE WRITE AFTER ANOTHER, never all at once. Each write is the server
             reading the document, changing one slot and writing it back, so
             three in flight together on a page with three tables were three
             read-modify-writes racing on one file: two of the three edits lost
             to the last writer, and the file itself torn — the front of one
             write, NUL bytes where the rest of another should have been, and
             the page unopenable. The server writes whole now; this stops
             asking it to race with itself. */
          todo.writes.reduce(function (done, w) {
            return done.then(function () { return rt.page.write(w.section, w.part, w.text); });
          }, Promise.resolve())
            .then(function () { return rt.page.order(todo.contents); })
            .then(function () { busy = false; }, function (e) {
              busy = false;
              if (typeof rt.report === "function") rt.report("a table could not be made into a grid section: " + String((e && e.message) || e));
            });
        }

        rt.convert = { tablesIn: tablesIn, split: split, plan: plan, cellsOf: cellsOf };
        if (rt.page && typeof rt.page.onDraw === "function") rt.page.onDraw(convert);
      })();
    </script>
  </body>
</html>
