<!--
  guest/pages/welcome.html — THE PAGE A NEW WORKSPACE OPENS ON, and it is the
  page's own `index.html` rather than a stack of doc sections.

  `ensureRoot` in server/domain/pages.ts copies this file into the root page's
  directory as `index.html` the first time a vault is mounted, and writes the
  words beside it in `content.yaml`. From that moment the copy is the person's:
  they can edit it, restyle it or delete the whole page, and nothing here
  reaches back into it.

  WHY THIS IS NOT A DOC PAGE. The one instruction on the screen is a band that
  bleeds the full width of the canvas over one of the brand's own risograph
  prints, and the doc plugin's frame exists to cap a part at the reading measure
  and centre it. A page whose SHAPE is the point draws itself; that is what the
  html page is for.

  EVERY WORD IS IN `content.yaml`, behind a `data-g-part` slot. On a page with
  no sections the slots are the page's own top-level keys under `input:` — the
  key IS the part — so each of them opens under the caret in the app and writes
  itself back. Nothing in here is a sentence anybody would want to change; what
  is in here is the layout, the drawings, and the sample figures inside the
  modules, which are illustration rather than copy.

  AN ASK IS TWO BLOCKS OF ONE MARKDOWN ITEM: the short line it is known by, and
  under it the real prompt somebody pastes into their agent. The prompt is set in
  the gauge role, like the folder in the band, and carries a Copy of its own —
  the script reads it off the DRAWN item, so an ask somebody rewrites here is the
  prompt that gets copied.

  THE ONE LINK ON THE PAGE IS A `[[wikilink]]` LIKE ANY OTHER, and it goes to the
  workspace's design doc. It is a word in `content.yaml` rather than an anchor in
  here, so it opens under the caret with the sentence around it; the runtime
  draws it, asks the host what it names on click and goes there. What made it
  reachable is one arm in `client/bridge/bridge.js` — the design doc lives
  outside `pages/`, so nothing in the tree could ever have resolved it.

  TWO MODULES TO A ROW AND NEVER MORE, down to one when the canvas is narrow. A
  page may not measure the window, so the step is a `@container` query on the
  figure, which is what `container-type: inline-size` on it is for.

  THE FIRST STEP IS NOT THE ASKS. The band says where to start the agent; the
  paragraph under it says what this is for and sends a person to Design first,
  because everything generated in a workspace comes out of its design doc and a
  page restyled afterwards is a page written twice.

  THE ONE FACT A PAGE CANNOT KNOW ABOUT ITSELF is the folder it sits in, and
  `biom.vault()` answers it at draw time. It is asked for and never stored: a
  path written into the document would be wrong the first time somebody moved
  the workspace, and wrong silently.

  BOTH COPIES REALLY COPY, and one attribute in the host is what buys it: the box
  has an opaque origin, so permissions policy blocks `navigator.clipboard` in
  here unless the frame is handed `allow="clipboard-write"` — measured both ways,
  with the argument beside the attribute in `client/frame/frame.js`. A write
  still wants a real gesture, which is exactly what a click on Copy is.

  THE COLOUR IS THE WORKSPACE'S OWN. Every value here is a palette token, so the
  page follows the folder it is in — except the module palettes at the bottom of
  the stylesheet, which are literals ON PURPOSE: they are OTHER workspaces, and a
  figure whose point is that the app wears the vault's colours cannot draw them
  all in this vault's.

  THE PRINT is the last rule in the stylesheet, as a data URL, and that is the
  one thing about this file worth knowing before scrolling: a workspace is text
  files, and `Files` reads and writes utf-8, so a picture that travels with a
  seeded page travels inside a text file. It is the night jungle from the
  brand's own risograph set, downscaled and re-encoded to about 240 KB.
-->

<style>
  /* THE MOTION SWITCH. Every duration below is multiplied by it, so one media
     query stops the whole figure rather than every animation in it remembering
     to ask. The one animation that is a keyframe rather than a duration is
     removed outright at the foot of this file. */
  :root { --motion: 1; }
  @media (prefers-reduced-motion: reduce) { :root { --motion: 0; } }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--stock);
    color: var(--ink);
    font-family: var(--sheet-face);
    font-size: 1rem;
    line-height: 1.6;
  }

  /* ── the band ─────────────────────────────────────────────────────────
     The step a person has to take is the widest thing on the screen, printed
     over the brand's own two-colour print. Flat ink only, the way the prints
     are: one flat veil at a single opacity, no gradient anywhere, and a rule
     at the foot where the paper ends rather than a fade. */
  .band {
    position: relative;
    min-height: 25rem;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-bottom: 1px solid var(--stock-edge);
    background: var(--stock);
    isolation: isolate;
  }

  .print {
    position: absolute;
    inset: 0;
    background-position: 50% 34%;
    background-size: cover;
    background-repeat: no-repeat;
  }

  .veil {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--stock) 62%, transparent);
  }

  .hair {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--yellow);
  }

  .bandin {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
    width: 100%;
    max-width: 52rem;
    padding: 3rem 3.5rem;
  }

  .heading :is(h1, h2, h3) {
    margin: 0;
    font-family: var(--sheet-face);
    font-weight: 700;
    font-size: clamp(2.25rem, 4.6vw, 3.5rem);
    line-height: 1.02;
    letter-spacing: -0.022em;
    text-wrap: balance;
    text-shadow: 0 2px 26px color-mix(in srgb, var(--shadow, var(--stock)) 60%, transparent);
  }

  .lede p {
    margin: 0;
    max-width: 34rem;
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink-2);
  }

  .lede strong { color: var(--ink); font-weight: 700; }

  /* WHAT THIS IS FOR, in the lede's own setting and the lede's own ink: it
     sits over the print, where the quieter ink drops under the veil and stops
     being readable. Same measure, because two paragraphs that wrap differently
     under one heading read as two different voices. */
  .about p {
    margin: 0;
    max-width: 34rem;
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--ink-2);
  }
  .about p + p { margin-top: 0.7rem; }
  .about strong { color: var(--ink-2); font-weight: 700; }
  /* A LINK IS THE PAGE'S OWN INK. The runtime draws a `[[wikilink]]` as an
     anchor it follows on click, and a browser's default blue is the one colour
     on this page the workspace does not choose. */
  .about a { color: var(--ink); text-decoration-color: var(--yellow); text-underline-offset: 0.16em; cursor: pointer; }
  .about a:hover { color: var(--yellow); }
  .about a[data-g-link-dead] { color: var(--ink-3); text-decoration-style: dotted; }

  /* The folder, printed once, in the gauge role because it is a path — behind a
     drawn folder, with Copy as the second half of the same object. */
  .folderbox {
    display: inline-flex;
    align-self: flex-start;
    align-items: stretch;
    max-width: 100%;
    margin-top: 0.35rem;
    border: 1px solid var(--rule);
    background: color-mix(in srgb, var(--stock) 88%, transparent);
  }

  .path {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    min-width: 0;
    padding: 0.7rem 1rem;
    font-family: var(--gauge-face);
    font-size: 1rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* A 2px square-capped drawing, one colour, no rounding. */
  .fold { position: relative; flex: none; width: 19px; height: 15px; color: var(--yellow); }
  .fold::before { content: ""; position: absolute; left: 0; top: 2px; right: 0; bottom: 0; border: 2px solid currentColor; }
  .fold::after { content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 4px; border: 2px solid currentColor; border-bottom: 0; }

  .copy {
    display: flex;
    align-items: center;
    flex: none;
    padding: 0 1.1rem;
    border: 0;
    background: var(--yellow);
    color: var(--on-spot);
    font-family: var(--furniture-face);
    font-weight: 700;
    font-size: 0.8125rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .copy:hover { background: color-mix(in srgb, var(--yellow) 86%, var(--ink)); }
  .copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* SAYING SO IS THE WHOLE FEEDBACK. A copy leaves nothing on the screen, so a
     control that changed nothing when it worked reads as one that did not. */
  .copy.done { background: var(--ink); color: var(--stock); }
  /* Until the path has arrived there is nothing to copy, and a control that
     does nothing is worse than one that is not there yet. */
  .copy[hidden] { display: none; }

  /* ── the line over the figure ────────────────────────────────────────── */
  .asks { padding: 2.75rem 3.5rem 0; }
  .asks :is(h1, h2, h3) {
    margin: 0 0 0.5rem;
    font-family: var(--sheet-face);
    font-weight: 700;
    font-size: 1.875rem;
    line-height: 1.12;
    letter-spacing: -0.012em;
  }
  .aside p { margin: 0; font-size: 1rem; color: var(--ink-3); }

  /* ── the figure ──────────────────────────────────────────────────────── */
  .figure { container-type: inline-size; padding: 1.9rem 3.5rem 3rem; }

  /* TWO TO A ROW, AND ONE WHEN THERE IS NO ROOM FOR TWO. A module now carries a
     whole prompt under it, and three or four of those across a wide canvas is a
     column of text too narrow to read — so the count is stated rather than left
     to fit. A page may not measure the WINDOW, which is why the step down is a
     `@container` query against the figure and not a `@media` one. */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2.1rem 1.6rem;
  }

  @container (max-width: 46rem) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }

  .grid > [data-g-item] {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    min-width: 0;
  }

  /* THE ASK is set the way it is TYPED — the gauge role behind a chevron,
     identically under every module, because the same gesture in two faces reads
     as two different things. It is the item's FIRST block; everything after it
     is the prompt. */
  .grid > [data-g-item] p {
    margin: 0;
    padding-left: 0.9rem;
    font-family: var(--gauge-face);
    font-size: 0.8125rem;
    line-height: 1.45;
    color: var(--ink-2);
    text-indent: -0.9rem;
  }

  .grid > [data-g-item] p:first-of-type::before { content: "\203A"; color: var(--yellow); font-weight: 700; padding-right: 0.45rem; }

  /* THE PROMPT is a block rather than a line: the same gauge role as the folder
     in the band, because both are text meant to be taken away rather than read.
     It is every block after the first, so a prompt somebody grows into two
     paragraphs is still a prompt. */
  .grid > [data-g-item] p:first-of-type { color: var(--ink); font-weight: 700; }

  .grid > [data-g-item] p ~ p {
    padding: 0.7rem 0.8rem;
    border: 1px solid var(--rule);
    background: color-mix(in srgb, var(--stock-hi) 70%, transparent);
    font-size: 0.75rem;
    line-height: 1.55;
    color: var(--ink-3);
    text-indent: 0;
  }

  .grid > [data-g-item] p ~ p + p { border-top: 0; }

  /* Copy, under the prompt rather than over it: a control laid on top of a block
     of text is a control that covers a word. */
  .pcopy {
    align-self: flex-start;
    margin-top: -0.2rem;
    border: 1px solid var(--rule);
    border-top: 0;
    background: var(--stock-hi);
    color: var(--ink-2);
    font-family: var(--furniture-face);
    font-weight: 700;
    font-size: 0.6875rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 0.35rem 0.75rem;
    cursor: pointer;
  }
  .pcopy:hover { color: var(--ink); border-color: var(--ink-3); }
  .pcopy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .pcopy.done { color: var(--on-spot); background: var(--yellow); border-color: var(--yellow); }

  /* The add and the per-item delete are the workspace's own harness — `items`
     draws both and inks neither, so a module can be taken out and an ask
     written that nobody here thought of. */
  .bar { position: absolute; top: 0.3rem; right: 0.3rem; opacity: 0; transition: opacity 0.15s ease; }
  [data-g-item]:hover .bar, [data-g-item]:focus-within .bar { opacity: 1; }
  .bar .btn, .add {
    border: 1px solid var(--rule);
    background: var(--stock-hi);
    color: var(--ink-2);
    font: inherit;
    font-size: 0.75rem;
    line-height: 1;
    padding: 0.3rem 0.5rem;
    cursor: pointer;
  }
  .bar .btn:hover, .add:hover { color: var(--ink); border-color: var(--ink-3); }
  .adds { padding: 0 3.5rem 4rem; }

  /* ── one module ──────────────────────────────────────────────────────── */
  /* A MODULE TAKES THE ROOM TWO-TO-A-ROW GIVES IT. Every drawing inside one is
     anchored to an edge or stated as a percentage, so the tile grows and the
     drawing grows with it — which is why the height is a step on the container
     rather than a number that has to stay small enough for four across. */
  .tile {
    position: relative;
    height: 190px;
    overflow: hidden;
    border: 1px solid var(--w-rule);
    border-radius: 3px;
    background: var(--w-stock);
    color: var(--w-ink);
    font-family: var(--w-face);
  }
  .tile * { box-sizing: border-box; }

  @container (min-width: 62rem) {
    .tile { height: 222px; }
  }

  .kind {
    position: absolute;
    top: 9px;
    left: 11px;
    z-index: 3;
    font-family: var(--furniture-face);
    font-weight: 700;
    font-size: 9.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--w-spot);
  }

  .head {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 11px;
    border-bottom: 1px solid var(--w-rule);
    z-index: 2;
  }
  .body { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; padding: 10px 11px; }
  .tl { font-size: 11px; font-weight: 700; color: var(--w-ink); margin-left: auto; }

  /* ── 1 the vault that was already written ─────────────────────────────────
     Notes on the left, pages on the right, and the ARROW is the animation: the
     left column is what somebody already has and the right is what it becomes,
     so the drawing has to show the crossing rather than two states side by
     side. */
  .turn { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 0; height: 100%; align-items: center; }
  .notes { display: grid; gap: 5px; min-width: 0; }
  .nt {
    border: 1px solid var(--w-rule);
    padding: 3px 5px;
    font-family: var(--gauge-face);
    font-size: 9px;
    line-height: 1.3;
    color: var(--w-ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nt u { text-decoration: none; color: var(--w-spot); }
  .cross { position: relative; height: 100%; }
  .cross svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .cross path {
    fill: none;
    stroke: var(--w-spot);
    stroke-width: 1.5;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    transition: stroke-dashoffset calc(0.6s * var(--motion)) cubic-bezier(0.4, 0, 0.2, 1);
  }
  .on .cross path { stroke-dashoffset: 0; }
  .made { display: grid; gap: 5px; min-width: 0; }
  .made > * {
    border: 1px solid var(--w-rule);
    padding: 4px 5px;
    opacity: 0;
    transform: translateX(-7px);
    transition: opacity calc(0.4s * var(--motion)) ease calc(0.5s * var(--motion)),
                transform calc(0.45s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1) calc(0.5s * var(--motion));
  }
  .on .made > * { opacity: 1; transform: none; }
  .on .made > * + * { transition-delay: calc(0.7s * var(--motion)); }
  .made h6 { margin: 0 0 3px; font-family: var(--sheet-face); font-size: 10px; font-weight: 700; line-height: 1.2; }
  .made .ru { display: block; height: 3px; margin-bottom: 3px; background: color-mix(in srgb, var(--w-ink) 20%, transparent); width: var(--w); }
  .made .mini { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
  .made .mini i { flex: 1; background: var(--w-spot); height: var(--h); }
  .made .mcols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .made .mcol { display: grid; gap: 3px; }
  .made .mcard { height: 9px; border: 1px solid var(--w-rule); background: color-mix(in srgb, var(--w-ink) 8%, transparent); }
  .made .mcard.hot { border-color: var(--w-spot); background: color-mix(in srgb, var(--w-spot) 22%, transparent); }

  /* ── 2 the second brain ───────────────────────────────────────────────────
     Every note is a node and every link is an edge, drawn dim; asking lights ONE
     PATH through them, a hop at a time, because what a second brain does with a
     question is walk from one thing you wrote to the next. */
  .graph { position: absolute; inset: 28px 0 0; }
  .graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .graph line.dim { stroke: color-mix(in srgb, var(--w-ink) 20%, transparent); stroke-width: 1; }
  .graph circle.dim { fill: color-mix(in srgb, var(--w-ink) 28%, transparent); }
  .graph line.lit {
    stroke: var(--w-spot);
    stroke-width: 1.5;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    transition: stroke-dashoffset calc(0.45s * var(--motion)) ease;
  }
  .on .graph line.lit { stroke-dashoffset: 0; }
  .graph circle.lit { fill: var(--w-spot); opacity: 0; transition: opacity calc(0.25s * var(--motion)) ease; }
  .on .graph circle.lit { opacity: 1; }
  .graph .s1 { transition-delay: calc(0.1s * var(--motion)); }
  .graph .s2 { transition-delay: calc(0.45s * var(--motion)); }
  .graph .s3 { transition-delay: calc(0.8s * var(--motion)); }
  .graph .s4 { transition-delay: calc(1.15s * var(--motion)); }
  .graph .s5 { transition-delay: calc(1.5s * var(--motion)); }

  /* ── 3 the morning pull ───────────────────────────────────────────────────
     What changed overnight is a FEED ARRIVING AT THE TOP, so the rows fall in
     one after another with what moved beside each, over a date mark that steps
     on to today and a small figure of the day's counts. */
  .ticker {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 6px;
    margin-bottom: 7px;
    border-bottom: 1px solid var(--w-rule);
  }
  .ticker .tick { font-family: var(--gauge-face); font-size: 10px; color: var(--w-spot); }
  .ticker .days { display: flex; gap: 3px; }
  .ticker .days s {
    display: block;
    width: 6px;
    height: 10px;
    text-decoration: none;
    border: 1px solid var(--w-rule);
    background: color-mix(in srgb, var(--w-ink) 12%, transparent);
  }
  .ticker .days s.now {
    background: transparent;
    border-color: var(--w-spot);
    transition: background calc(0.35s * var(--motion)) ease calc(0.5s * var(--motion));
  }
  .on .ticker .days s.now { background: var(--w-spot); }
  .ticker .delta { display: flex; align-items: flex-end; gap: 2px; height: 16px; margin-left: auto; }
  .ticker .delta i {
    display: block;
    width: 4px;
    height: var(--h);
    background: color-mix(in srgb, var(--w-ink) 28%, transparent);
    transform: scaleY(0);
    transform-origin: 50% 100%;
    transition: transform calc(0.45s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1);
  }
  .on .ticker .delta i { transform: none; }
  .on .ticker .delta i:nth-child(2) { transition-delay: calc(0.05s * var(--motion)); }
  .on .ticker .delta i:nth-child(3) { transition-delay: calc(0.1s * var(--motion)); }
  .on .ticker .delta i:nth-child(4) { transition-delay: calc(0.15s * var(--motion)); }
  .on .ticker .delta i:nth-child(5) { transition-delay: calc(0.2s * var(--motion)); }
  .feed { display: grid; gap: 4px; }
  .fr {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--w-rule);
    padding: 3px 6px;
    font-size: 9.5px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-9px);
    transition: opacity calc(0.36s * var(--motion)) ease,
                transform calc(0.4s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1);
  }
  .on .fr { opacity: 1; transform: none; }
  .on .fr:nth-child(1) { transition-delay: calc(0.28s * var(--motion)); }
  .on .fr:nth-child(2) { transition-delay: calc(0.46s * var(--motion)); }
  .on .fr:nth-child(3) { transition-delay: calc(0.64s * var(--motion)); }
  .fr span { overflow: hidden; text-overflow: ellipsis; }
  .fr u { margin-left: auto; text-decoration: none; font-family: var(--gauge-face); color: var(--w-spot); }

  /* ── 4 digest ────────────────────────────────────────────────────────── */
  .dateline {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 6px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--w-rule);
    font-size: 9px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--w-ink-2);
    font-family: var(--furniture-face);
    font-weight: 700;
  }
  .marks { margin-left: auto; display: flex; gap: 4px; }
  .marks s {
    width: 13px;
    height: 13px;
    display: block;
    text-decoration: none;
    border: 1px solid var(--w-rule);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity calc(0.4s * var(--motion)) ease, transform calc(0.4s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1);
  }
  .on .marks s { opacity: 1; transform: none; }
  .on .marks s:nth-child(1) { transition-delay: calc(0.15s * var(--motion)); }
  .on .marks s:nth-child(2) { transition-delay: calc(0.3s * var(--motion)); }
  .on .marks s:nth-child(3) { transition-delay: calc(0.45s * var(--motion)); }
  .marks s.a { background: color-mix(in srgb, var(--w-spot) 80%, transparent); }
  .marks s.b { background: color-mix(in srgb, var(--w-ink) 55%, transparent); }
  .marks s.c { background: color-mix(in srgb, var(--w-ink-2) 45%, transparent); }
  .dtile { margin-bottom: 8px; }
  .dtile h6 { margin: 0 0 4px; font-family: var(--sheet-face); font-size: 11.5px; font-weight: 700; line-height: 1.2; }
  .dtile .fill { display: grid; gap: 4px; }
  .dtile .fill b {
    display: block;
    height: 4px;
    background: color-mix(in srgb, var(--w-ink) 20%, transparent);
    width: 0;
    transition: width calc(0.6s * var(--motion)) cubic-bezier(0.4, 0, 0.2, 1);
  }
  .on .dtile .fill b { width: var(--w); }
  .on .dtile .fill b:nth-child(2) { transition-delay: calc(0.18s * var(--motion)); }
  .dtile .src { font-family: var(--furniture-face); font-size: 9px; color: var(--w-spot); letter-spacing: 0.04em; }

  /* ── 5 the table that fills ───────────────────────────────────────────────
     A scrape is a row that was not there yesterday, so the drawing is the
     TABLE ARRIVING: a header, rows dropping in one after another, and the
     newest lit. */
  .th {
    display: flex;
    gap: 8px;
    padding: 0 0 3px;
    font-family: var(--furniture-face);
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--w-ink-2);
  }
  .th span:last-child { margin-left: auto; }
  .tbl { border-top: 1px solid var(--w-rule); }
  .tbl .r {
    display: flex;
    gap: 8px;
    padding: 2px 0;
    border-bottom: 1px solid var(--w-rule);
    font-size: 9.5px;
    font-family: var(--gauge-face);
    color: var(--w-ink-2);
    opacity: 0;
    transform: translateY(-5px);
    transition: opacity calc(0.34s * var(--motion)) ease,
                transform calc(0.34s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1),
                background 0.4s ease;
  }
  .tbl .r span:last-child { margin-left: auto; color: var(--w-ink); }
  .on .tbl .r { opacity: 1; transform: none; }
  .on .tbl .r:nth-of-type(1) { transition-delay: calc(0.08s * var(--motion)); }
  .on .tbl .r:nth-of-type(2) { transition-delay: calc(0.26s * var(--motion)); }
  .on .tbl .r:nth-of-type(3) { transition-delay: calc(0.44s * var(--motion)); }
  .tbl .r.new { color: var(--w-ink); }
  .on .tbl .r.new { background: color-mix(in srgb, var(--w-spot) 12%, transparent); transition-delay: calc(0.62s * var(--motion)); }

  /* ── 6 dashboard ─────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .kpi { border: 1px solid var(--w-rule); padding: 5px 6px; }
  .kpi .k { font-size: 8px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--w-ink-2); }
  .kpi .v { font-family: var(--gauge-face); font-size: 13.5px; line-height: 1.25; color: var(--w-ink); font-variant-numeric: tabular-nums; }
  .kpi.lit { border-color: var(--w-spot); }
  .kpi.lit .v { color: var(--w-spot); }
  .chart { position: relative; height: 66px; display: flex; align-items: flex-end; gap: 5px; border-bottom: 1px solid var(--w-rule); }
  .chart i {
    flex: 1;
    display: block;
    background: color-mix(in srgb, var(--w-ink) 30%, transparent);
    height: var(--h);
    transform: scaleY(0);
    transform-origin: 50% 100%;
    transition: transform calc(0.55s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1), background calc(0.4s * var(--motion)) ease;
  }
  .on .chart i { transform: none; }
  .on .chart i.lit { background: var(--w-spot); }
  .chart i:nth-child(1) { transition-delay: calc(0.02s * var(--motion)); }
  .chart i:nth-child(2) { transition-delay: calc(0.07s * var(--motion)); }
  .chart i:nth-child(3) { transition-delay: calc(0.12s * var(--motion)); }
  .chart i:nth-child(4) { transition-delay: calc(0.17s * var(--motion)); }
  .chart i:nth-child(5) { transition-delay: calc(0.22s * var(--motion)); }
  .chart i:nth-child(6) { transition-delay: calc(0.27s * var(--motion)); }
  .chart i:nth-child(7) { transition-delay: calc(0.32s * var(--motion)); }

  /* ── 7 the diagram that follows the code ─────────────────────────────── */
  .map { position: absolute; inset: 28px 0 0; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map svg line {
    stroke: color-mix(in srgb, var(--w-ink) 26%, transparent);
    stroke-width: 1;
    /* LONGER THAN THE LONGEST EDGE, so the draw-on covers the whole line: a
       dash pattern shorter than the line leaves a gap in the middle of an edge
       that is supposed to be finished. */
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    opacity: 0;
    marker-end: url(#arrow);
    transition: stroke-dashoffset calc(0.5s * var(--motion)) ease,
                opacity calc(0.3s * var(--motion)) ease;
  }
  .on .map svg line { stroke-dashoffset: 0; opacity: 1; }
  .on .map svg line.l2 { transition-delay: calc(0.5s * var(--motion)); }
  /* THE ARROWHEAD RIDES THE LINE'S OPACITY rather than its dashes: a marker is
     drawn whatever the dash pattern says, so a line that had only a dashoffset
     would arrive as a head with no shaft behind it. */
  .map marker path { fill: color-mix(in srgb, var(--w-ink) 26%, transparent); }
  /* THE EDGE THAT MOVED. `was` is the wiring at rest and goes as the drawing
     settles; `now` is the one that replaces it, a beat later, with the box it
     reaches. Together with `.kid.d3` that is the tile's claim: the diagram is
     redrawn from the tree rather than kept by hand. A REROUTE IS TWO EDGES and
     not one moving, because `x2` on a line is an attribute a stylesheet cannot
     animate — two edges is the honest drawing of it in CSS. */
  .map svg line.was {
    /* IT ARRIVES LIKE EVERY OTHER EDGE AND THEN GOES, which is two values of one
       property in one state — so the going is `stroke-opacity`, a second
       property with a delay of its own, and the three delays below line up with
       the three transitions here. NO ARROWHEAD, because a marker is painted
       with its own fill rather than the stroke's: it would sit there after the
       shaft had left. */
    marker-end: none;
    stroke-opacity: 1;
    transition: stroke-dashoffset calc(0.5s * var(--motion)) ease,
                opacity calc(0.3s * var(--motion)) ease,
                stroke-opacity calc(0.35s * var(--motion)) ease;
  }
  .on .map svg line.was { stroke-opacity: 0; transition-delay: 0s, 0s, calc(0.95s * var(--motion)); }
  .on .map svg line.now { transition-delay: calc(1.05s * var(--motion)); }
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 4px 7px;
    border: 1px solid var(--w-rule);
    background: var(--w-stock);
    font-size: 9.5px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .node.kid {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.9);
    transition: opacity calc(0.4s * var(--motion)) ease, transform calc(0.4s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1);
  }
  .on .node.kid { opacity: 1; transform: translate(-50%, -50%); }
  .on .node.kid.d1 { transition-delay: calc(0.55s * var(--motion)); }
  /* A BEAT AFTER EVERYTHING ELSE HAS SETTLED, which is the whole of what makes
     this a diagram that follows the code rather than one somebody drew: the
     drawing finishes, and then it changes. */
  .on .node.kid.d2 { transition-delay: calc(1.2s * var(--motion)); }
  .node.hot { border-color: var(--w-spot); color: var(--w-spot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--w-spot) 14%, transparent); }

  /* ── 8 board ─────────────────────────────────────────────────────────── */
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; height: 100%; }
  .col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .col .ch {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 8px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--w-ink-2);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--w-rule);
  }
  .col .ch u { margin-left: auto; text-decoration: none; font-family: var(--gauge-face); letter-spacing: 0; font-size: 9px; position: relative; }
  .col .ch u s { text-decoration: none; transition: opacity calc(0.3s * var(--motion)) ease calc(0.55s * var(--motion)); }
  .col .ch u s.now { position: absolute; right: 0; top: 0; opacity: 0; color: var(--w-spot); }
  .on .col .ch u s.was { opacity: 0; }
  .on .col .ch u s.now { opacity: 1; }
  .crd { border: 1px solid var(--w-rule); background: var(--w-stock); padding: 5px 6px; font-size: 9.5px; line-height: 1.25; color: var(--w-ink); }
  .crd em { display: block; font-style: normal; font-family: var(--gauge-face); font-size: 8.5px; color: var(--w-ink-2); margin-top: 3px; }
  .crd.fly { position: relative; transform: translate(0, 0); transition: transform calc(0.72s * var(--motion)) cubic-bezier(0.5, 0, 0.2, 1); }
  .on .crd.fly { transform: translate(calc(100% + 6px), 0); border-color: var(--w-spot); }
  .crd.ghost { border-style: dashed; color: transparent; opacity: 0; transition: opacity calc(0.3s * var(--motion)) ease calc(0.5s * var(--motion)); }
  .on .crd.ghost { opacity: 0.55; }

  /* ── 9 the nightly run ───────────────────────────────────────────────── */
  .clock { position: absolute; left: 11px; top: 30px; width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--w-rule); }
  .clock::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--w-spot);
    clip-path: inset(0 0 0 50%);
    opacity: 0;
    transition: opacity calc(0.3s * var(--motion)) ease;
  }
  .on .clock::after { opacity: 1; }
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1.5px;
    height: 21px;
    background: var(--w-spot);
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform calc(1s * var(--motion)) cubic-bezier(0.5, 0, 0.2, 1);
  }
  .on .hand { transform: translate(-50%, -100%) rotate(210deg); }
  .when { position: absolute; left: 11px; top: 90px; width: 54px; text-align: center; font-family: var(--gauge-face); font-size: 10px; color: var(--w-spot); }
  .landed {
    position: absolute;
    left: 72px;
    right: 11px;
    top: 30px;
    bottom: 9px;
    border: 1px solid var(--w-rule);
    padding: 5px 7px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px) scale(0.985);
    transition: opacity calc(0.45s * var(--motion)) ease calc(0.75s * var(--motion)),
                transform calc(0.5s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1) calc(0.75s * var(--motion)),
                border-color 0.4s ease;
  }
  .on .landed { opacity: 1; transform: none; border-color: color-mix(in srgb, var(--w-spot) 55%, var(--w-rule)); }
  .landed h6 {
    margin: 0 0 3px;
    font-family: var(--furniture-face);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--w-ink-2);
  }
  .landed .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 1.5px 0;
    border-top: 1px solid var(--w-rule);
    font-size: 9.5px;
    white-space: nowrap;
    color: var(--w-ink);
    opacity: 0;
    transition: opacity calc(0.3s * var(--motion)) ease;
  }
  .on .landed .row { opacity: 1; }
  .on .landed .row:nth-of-type(1) { transition-delay: calc(1.05s * var(--motion)); }
  .on .landed .row:nth-of-type(2) { transition-delay: calc(1.2s * var(--motion)); }
  .on .landed .row:nth-of-type(3) { transition-delay: calc(1.35s * var(--motion)); }
  .landed .row u { margin-left: auto; text-decoration: none; font-family: var(--gauge-face); color: var(--w-spot); }
  /* ── 10 comparison ───────────────────────────────────────────────────── */
  .panes { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .pane { padding: 0 9px; min-width: 0; position: relative; }
  .pane + .pane { border-left: 1px solid var(--w-rule); }
  .pane .pt {
    font-family: var(--furniture-face);
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--w-ink-2);
    padding-bottom: 5px;
    border-bottom: 1px solid var(--w-rule);
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .pane .pt s { width: 5px; height: 5px; border-radius: 50%; background: var(--w-rule); text-decoration: none; }
  .pane.b .pt { color: var(--w-spot); }
  .pane.b .pt s { background: var(--w-spot); }
  .pane h6 { margin: 0 0 5px; font-family: var(--sheet-face); font-size: 12px; font-weight: 700; line-height: 1.15; }
  .pane .ln { display: block; height: 4px; margin-bottom: 4px; background: color-mix(in srgb, var(--w-ink) 18%, transparent); width: var(--w); }
  .pane .ln.diff {
    background: color-mix(in srgb, var(--w-spot) 25%, transparent);
    transition: background calc(0.45s * var(--motion)) ease, width calc(0.55s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1);
  }
  .on .pane .ln.diff { background: var(--w-spot); width: 92%; }
  .pane .bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 7px; }
  .pane .bars i { flex: 1; background: color-mix(in srgb, var(--w-ink) 20%, transparent); height: var(--h); }
  .pane.b .bars i { background: color-mix(in srgb, var(--w-spot) 45%, transparent); transition: height calc(0.6s * var(--motion)) cubic-bezier(0.16, 1, 0.3, 1); }
  .on .pane.b .bars i { height: var(--h2); }
  .sweep { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--w-spot); left: 50%; opacity: 0; }
  .on .sweep { animation: sweep calc(1.6s * var(--motion)) cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes sweep { 0% { opacity: 0.9; transform: translateX(-40%); } 100% { opacity: 0; transform: translateX(45%); } }

  /* ── the geometry of the drawings ────────────────────────────────────────
     A bar's height, a rule's width and a node's place on the map are numbers
     the drawing is made of, and they are classes rather than style attributes:
     presentation lives in this one block, where a person can change it in one
     place and a diff shows what moved. */
  .h34 { --h: 34%; } .h52 { --h: 52%; } .h41 { --h: 41%; } .h68 { --h: 68%; }
  .h57 { --h: 57%; } .h94 { --h: 94%; } .h72 { --h: 72%; } .h40 { --h: 40%; }
  .h58 { --h: 58%; } .h47 { --h: 47%; } .h66 { --h: 66%; }
  .t62 { --h2: 62%; } .t74 { --h2: 74%; } .t70 { --h2: 70%; } .t96 { --h2: 96%; }
  .w100 { --w: 100%; } .w94 { --w: 94%; } .w88 { --w: 88%; }
  .w72 { --w: 72%; } .w62 { --w: 62%; } .w54 { --w: 54%; } .w52 { --w: 52%; }

  .at-core { left: 50%; top: 26%; }
  .at-web { left: 22%; top: 58%; }
  .at-queue { left: 50%; top: 58%; }
  .at-worker { left: 78%; top: 58%; }
  .at-store { left: 60%; top: 88%; }
  .at-cache { left: 90%; top: 88%; }

  /* ── the workspace palettes ──────────────────────────────────────────────
     THE ONLY LITERALS IN THIS FILE, one per module, in the order the modules
     are drawn. Each one wears a DIFFERENT workspace's colours, because that is
     what the figure is claiming: the app follows the folder it has open.
     Painting them from this vault's tokens would draw one workspace ten times
     and say the opposite. */
  .b-vault  { --w-stock: #F3EEE4; --w-ink: #24201B; --w-ink-2: #7A7166; --w-rule: #DBD3C5; --w-spot: #C2512A; --w-face: var(--sheet-face); }
  .b-brain  { --w-stock: #101423; --w-ink: #DDE1F2; --w-ink-2: #8B92B4; --w-rule: #1D2338; --w-spot: #7E8CF0; --w-face: var(--furniture-face); }
  .b-feed   { --w-stock: #0D1113; --w-ink: #D2DEE0; --w-ink-2: #7F9296; --w-rule: #1B2326; --w-spot: #3FCFBC; --w-face: var(--gauge-face); }
  .b-dig    { --w-stock: #F4ECDB; --w-ink: #241D12; --w-ink-2: #7E7361; --w-rule: #E0D5BE; --w-spot: #B4661C; --w-face: var(--sheet-face); }
  .b-scrape { --w-stock: #F7F6F1; --w-ink: #1C1B18; --w-ink-2: #6E6A60; --w-rule: #E2DED3; --w-spot: #1F6F5C; --w-face: var(--furniture-face); }
  .b-dash   { --w-stock: #141A22; --w-ink: #DCE5EF; --w-ink-2: #8E9CAE; --w-rule: #232D3A; --w-spot: #E9A23B; --w-face: var(--furniture-face); }
  .b-arch   { --w-stock: #0F1714; --w-ink: #D9E7DE; --w-ink-2: #87A294; --w-rule: #1F2E27; --w-spot: #5FC694; --w-face: var(--furniture-face); }
  .b-board  { --w-stock: #EFF1F9; --w-ink: #1B1E2E; --w-ink-2: #6E7391; --w-rule: #D9DCEC; --w-spot: #4756C7; --w-face: var(--furniture-face); }
  .b-night  { --w-stock: #151A14; --w-ink: #DDE4D6; --w-ink-2: #8E9C84; --w-rule: #232C21; --w-spot: #A8C93F; --w-face: var(--gauge-face); }
  .b-cmp    { --w-stock: #151119; --w-ink: #E6DCEF; --w-ink-2: #9A8DA8; --w-rule: #271E30; --w-spot: #B87BE8; --w-face: var(--sheet-face); }

  /* MOTION LIVES INSIDE THE FIGURE AND NOWHERE ELSE, and it stops entirely for
     a reader who has asked for less: `--motion` zeroes every duration above,
     and the one keyframe animation is removed here. Every module rests FULL,
     so the figure is complete when it is still. */
  @media (prefers-reduced-motion: reduce) {
    .tile * { animation: none !important; transition: none !important; }
  }

  /* THE PRINT, and the last rule in this file on purpose: it is one line and it
     is most of the bytes. The night jungle from the brand's own risograph set.

<script>
  (function () {
    "use strict";

    /* ── copying ──────────────────────────────────────────────────────────
       BOTH COPIES ON THIS PAGE GO THROUGH HERE, and it is a real clipboard
       write. The box is a sandboxed frame with an opaque origin, so permissions
       policy reads it as a cross-origin child and refuses `clipboard-write`
       unless the container delegates it — measured both ways, and the frame
       host delegates exactly that one permission with the argument beside the
       attribute in `client/frame/frame.js`. The browser still wants a real
       gesture before a write, which a click on Copy is.

       THE SELECTION IS THE FALLBACK AND NOT THE FEATURE. A write can still be
       refused — a browser that does not delegate the permission, a page that
       has lost focus — so a refusal leaves the text selected and one keystroke
       away rather than leaving the control looking broken.

       SAYING SO IS THE WHOLE FEEDBACK. A copy leaves nothing on the screen, so
       a control that changed nothing when it worked reads as one that did not.
       @param {HTMLElement} button @param {string} text @param {() => void} fallback */
    function copied(button, text, fallback) {
      var said = button.textContent;
      function done() {
        button.classList.add("done");
        button.textContent = "Copied";
        setTimeout(function () {
          button.classList.remove("done");
          button.textContent = said;
        }, 1400);
      }
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard.writeText(text).then(done, function () { fallback(); });
          return;
        }
      } catch (e) {
        /* A clipboard that throws where it was expected to reject is the same
           answer, and the fallback below is what a person gets either way. */
      }
      fallback();
    }

    /** @param {Node} node */
    function select(node) {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      if (!sel) return;
      sel.removeAllRanges();
      sel.addRange(range);
    }

    /* ── the folder ───────────────────────────────────────────────────────
       Asked for where the page is drawn and never stored, so it survives the
       workspace being moved. */
    var where = document.getElementById("where");
    var copy = document.getElementById("copy");

    if (copy) {
      copy.addEventListener("click", function () {
        var path = where.textContent || "";
        if (path === "") return;
        copied(copy, path, function () { select(where); });
      });
    }

    if (typeof biom !== "undefined" && typeof biom.vault === "function") {
      biom.vault().then(function (v) {
        if (!v || typeof v.path !== "string" || v.path === "") return;
        where.textContent = v.path;
        if (copy) copy.hidden = false;
      }).catch(function (e) {
        /* A page that cannot reach the host has nothing true to say about where
           it is, and an error in the band would be a sentence nobody can act
           on. The console is where the reason belongs. */
        console.warn("[biom] the welcome page could not read the vault", e);
      });
    }

    /* ── the modules ──────────────────────────────────────────────────────
       The asks are a list slot, so the runtime draws one element per ask and
       this puts that ask's module above it. It runs again whenever the slot is
       redrawn — an ask is redrawn from its markdown every time somebody
       finishes typing in it — which is the same reason `items` watches. An ask
       with no template left to take gets no module and is still an ask.

       AN ASK IS TWO BLOCKS: the short line it is known by, and the prompt under
       it. The Copy is built from the DRAWN item rather than from anything held
       here, so a prompt somebody rewrites in the page is the prompt that gets
       copied. */
    var tiles = document.getElementById("tiles");
    var slot = document.querySelector('[data-g-part="asks"]');

    /** Every block of an ask after the first, which is its prompt.
     *  @param {Element} holder */
    function promptOf(holder) {
      var blocks = Array.prototype.slice.call(holder.querySelectorAll(":scope > p"));
      return blocks.slice(1).map(function (p) { return p.textContent || ""; }).join("\n\n").trim();
    }

    function dress() {
      if (!slot || !tiles) return;
      var holders = slot.querySelectorAll(":scope > [data-g-item]");
      Array.prototype.forEach.call(holders, function (holder, i) {
        if (holder.querySelector(":scope > .tile") === null) {
          var source = tiles.content.children[i];
          if (source) holder.insertBefore(source.cloneNode(true), holder.firstChild);
        }
        if (holder.querySelector(":scope > .pcopy") === null && promptOf(holder) !== "") {
          var b = document.createElement("button");
          b.className = "pcopy";
          b.type = "button";
          b.textContent = "Copy";
          b.setAttribute("aria-label", "Copy this prompt");
          /* The press is refused and the click acted on, for the reason the
             `items` harness gives its own controls: pressing inside an open
             editor blurs it, the blur redraws the item, and the redraw would
             take this button with it before the click arrived. */
          b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
          b.addEventListener("click", function (ev) {
            // A click inside an item opens that item's markdown. This is a
            // control and not a word, so the click stops here.
            ev.preventDefault();
            ev.stopPropagation();
            /* AND THE BUTTON TAKES FOCUS ITSELF, because the press above
               refused it. A clipboard write is refused outright by a document
               that is not focused, and the first click on this page is exactly
               the one that would have focused it. */
            try { b.focus(); } catch (e) { /* a browser that will not is the fallback's case */ }
            var last = holder.querySelector(":scope > p:last-of-type");
            copied(b, promptOf(holder), function () { if (last) select(last); });
          });
          holder.appendChild(b);
        }
      });
      run();
    }

    /* ── the clock ────────────────────────────────────────────────────────
       ONE CLOCK, AND IT REACHES ONLY THE MODULES. Each module holds its own
       short loop in CSS off a single class; this adds and removes it, staggered
       so no two are ever in step. It runs only while the figure is on screen,
       and under `prefers-reduced-motion` every module settles written and it
       never starts. */
    var ON = 4200, OFF = 1100, STEP = 520;
    var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var timers = [];
    var running = false;

    function stop() {
      running = false;
      timers.forEach(clearTimeout);
      timers = [];
    }

    function loop(tile, wait) {
      timers.push(setTimeout(function () {
        if (!running) return;
        tile.classList.add("on");
        count(tile);
        timers.push(setTimeout(function () {
          tile.classList.remove("on");
          if (running) loop(tile, OFF);
        }, ON));
      }, wait));
    }

    /* The one number that COUNTS rather than appears, because a figure that
       counts is saying the page is live where the others are saying it is
       drawn. The unit is beside it in the tile, so what runs up here is the
       bare figure. */
    function count(tile) {
      var v = tile.querySelector("[data-count]");
      if (!v) return;
      var to = Number(v.getAttribute("data-count"));
      if (!(to > 0)) return;
      var t0 = performance.now();
      (function tick(now) {
        var p = Math.min(1, Math.max(0, (now - t0) / 900));
        var e = 1 - Math.pow(1 - p, 3);
        v.textContent = (to * e).toFixed(1);
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }

    function run() {
      var all = Array.prototype.slice.call(document.querySelectorAll(".tile"));
      if (still) {
        all.forEach(function (t) { t.classList.add("on"); });
        return;
      }
      stop();
      running = true;
      all.forEach(function (t, i) { loop(t, i * STEP); });
    }

    if (slot) {
      var watch = new MutationObserver(function (records) {
        var real = records.some(function (r) {
          return Array.prototype.some.call(r.addedNodes, function (x) {
            return !(x.nodeType === 1 && x.classList
              && (x.classList.contains("tile") || x.classList.contains("bar") || x.classList.contains("pcopy")));
          }) || r.removedNodes.length > 0;
        });
        if (real) dress();
      });
      watch.observe(slot, { childList: true, subtree: true });
    }

    /* A figure nobody is looking at is a timer nobody asked for. */
    var figure = document.querySelector(".figure");
    if (figure && !still && typeof IntersectionObserver === "function") {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) run();
          else stop();
        });
      }, { threshold: 0.02 }).observe(figure);
    }

    dress();
  })();
</script>
