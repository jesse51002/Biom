<!-- WHICH BUILD THIS IS, and the only channel that can carry it. The client has
     no build step, ever — boot.js is served exactly as it sits on disk — so a
     compile-time `--define` cannot reach it and the document it is handed can.
     `server/main.ts` rewrites this one attribute on the way out; it writes
     `development` in a development build, so what the development server returns
     is byte-identical to this file and a raw copy opened off disk is honest.
     `client/boot.js` reads it once and nothing else in the client ever does. -->
<meta name="biom-env" content="development">

<!-- No build step, deliberately. Every file below is served as it sits on disk,
     so Claude Code writing one and this window drawing it is the whole loop.
     Adding a transpile step between those two is breaking the instrument.

     Order matters once: tokens declares the world, the content sheets dress the
     views, and the chrome comes last so host furniture wins any tie against a
     page. A page's own CSS is not here at all: it is inside the frame that draws
     it, on the other side of an origin this document cannot reach. -->
<!-- Vendored code, resolved by the browser rather than by a bundler. This is
     what keeps `import MarkdownIt from "markdown-it"` a BARE specifier in
     client/platform/markdown.js — which tools/layers.mjs already skips as a
     package, so a third-party import adds no edge to the dependency graph and
     needs no exception in layers.json. -->
<script type="importmap">
{ "imports": { "markdown-it": "/vendor/markdown-it.mjs" } }
</script>
