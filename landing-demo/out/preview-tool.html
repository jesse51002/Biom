<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo section preview · tool</title>
<style>
  html,body{margin:0; background:#0E0F11; color:#EDE6D6; font-family:Georgia,"Times New Roman",serif}
  .standin{min-height:72svh; display:grid; place-content:center; text-align:center; padding:48px 16px; box-sizing:border-box}
  .standin h1{margin:0; font-size:clamp(34px, 6vw, 72px); line-height:1.05; letter-spacing:-.01em; font-weight:700}
  .standin p{margin:18px 0 0; color:#B9B3A5; font-size:clamp(16px, 2vw, 20px)}
  .note{font:12px ui-monospace,monospace; color:#8F8A7C; letter-spacing:.04em}
  .next{min-height:60svh; display:grid; place-content:center; padding:48px 16px; border-top:1px solid #2C3036; text-align:center}
</style></head><body>
<header class="standin"><div class="note">STAND-IN HERO · not biom.dev's</div><h1>A living workspace<br>for humans and agents</h1><p>The demo section follows directly.</p></header>
<!-- THE DEMO SECTION, to sit directly after the hero on biom.dev.

     A GIF, so it plays and loops on its own and carries no controls. The browser
     picks one of four files: the narrow composition under 700px, the wide one
     above it, and the finished frame instead of either when the visitor asked
     for reduced motion. Every <source> names its own width and height, so the
     box is reserved before a byte arrives and nothing below it moves.
     `loading="lazy"` fetches it as it nears the viewport, which, straight after
     the hero, is on arrival or the first scroll.

     Copy the four files from landing-demo/out/ beside the page, or change the
     paths. The CSS is self-contained and names the brand's charcoal and cream
     only through the two custom properties at the top. -->
<style>
  .bd-demo{
    --bd-ground:#0E0F11; --bd-edge:rgba(237,230,214,.14);
    --bd-pad:clamp(16px, 3vw, 40px);
    --bd-ratio:1.6;                       /* 1920 / 1200 */
    box-sizing:border-box; min-height:100vh; min-height:100svh;
    display:grid; place-items:center;
    padding:var(--bd-pad) 16px;
    background:var(--bd-ground);
  }
  .bd-demo figure{margin:0; width:100%}
  .bd-demo picture{display:contents}
  .bd-demo img{
    display:block; height:auto; margin:0 auto;
    width:min(100%, calc((100vh - 2 * var(--bd-pad) - 2px) * var(--bd-ratio)));
    width:min(100%, calc((100svh - 2 * var(--bd-pad) - 2px) * var(--bd-ratio)));
    border:1px solid var(--bd-edge); border-radius:12px;
    box-shadow:0 1px 0 rgba(0,0,0,.6), 0 40px 90px -30px rgba(0,0,0,.9);
    background:var(--bd-ground);
  }
  @media (max-width:700px){
    .bd-demo{--bd-ratio:0.629}             /* 780 / 1240 */
    .bd-demo img{border-radius:10px}
  }
</style>
<section class="bd-demo" aria-label="Biom at work">
  <figure>
    <picture>
      <source media="(prefers-reduced-motion: reduce) and (max-width: 700px)" srcset="demo-tool-mobile-still.png" width="780" height="1238">
      <source media="(prefers-reduced-motion: reduce)" srcset="demo-tool-desktop-still.png" width="1280" height="800">
      <source media="(max-width: 700px)" srcset="demo-tool-mobile.gif" width="780" height="1238">
      <img src="demo-tool-desktop.gif" width="1280" height="800" loading="lazy" decoding="async"
           alt="Biom, with a custom tool called Inbound open in a workspace. Run triage is pressed and an automation takes twelve demo requests through four steps: research, enrich, score and draft. The tool draws each step as it lands, marks three requests hot and the rest nurture, drafts a reply to the hottest one, and sorts the queue by fit. Illustrative demo, invented data.">
    </picture>
  </figure>
</section>

<section class="next"><div class="note">STAND-IN · the rest of the page</div><p>Scrolling continues normally past the demo.</p></section>
</body></html>
