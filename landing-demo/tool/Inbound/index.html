<!--
  Inbound — a triage tool, drawn by this page and nothing else.

  A queue of demo requests on the left, the request the run found hottest on
  the right, and the four steps of the `triage` automation across the top.
  The Run button starts that automation (`biom.start`); the automation writes
  each step back to the `inbound` table through Biom's API; this page reads the
  table and draws what it says. No doc plugin, no board: the page is its own UI.

  The title and the line under it are markdown parts in content.yaml, so they
  open under the caret like any other words in a workspace.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inbound</title>
<style>
  :root{
    --l-led:var(--led, var(--cyan));
    --l-green:var(--led-green, var(--ink-2));
    --l-off:var(--dot-off, var(--rule-soft));
    --l-glow:color-mix(in srgb, var(--l-led) 50%, transparent);
    --l-field:color-mix(in srgb, var(--ink) 4%, var(--stock-hi));
    --sheet:var(--sheet-face, Georgia, serif);
    --gauge:var(--gauge-face, ui-monospace, monospace);
    --furn:var(--furniture-face, system-ui, sans-serif);
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:var(--stock); color:var(--ink)}
  body{font:16px/1.4 var(--sheet); -webkit-font-smoothing:antialiased; overflow:hidden}
  #tool{height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); padding:30px 30px 26px; gap:16px}

  /* ── the head ── */
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px}
  .title [data-g-part="title"] h1, .title h1{margin:0; font:700 34px/1.05 var(--sheet); letter-spacing:-.01em}
  .title [data-g-part="lede"] p{margin:6px 0 0; font:16px/1.4 var(--sheet); color:var(--ink-2)}
  .act{display:flex; align-items:center; gap:16px; flex:none}
  .count{display:flex; align-items:center; gap:9px; font:13px var(--gauge); letter-spacing:.02em; color:var(--ink-2); white-space:nowrap}
  .count b{font-weight:400; color:var(--ink)}
  .led{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--l-off); flex:none}
  .led.lit{background:var(--l-led); box-shadow:0 0 0 3px color-mix(in srgb, var(--l-led) 14%, transparent), 0 0 10px var(--l-glow)}
  .led.green{background:var(--l-green); box-shadow:0 0 0 3px color-mix(in srgb, var(--l-green) 14%, transparent)}
  #run{display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 20px; border:0; background:var(--l-led); color:var(--on-spot, var(--stock));
    font:600 15px var(--furn); letter-spacing:.06em; text-transform:uppercase; cursor:pointer; transition:transform .1s, background .2s, color .2s}
  #run:active{transform:scale(.96)}
  #run[disabled]{background:var(--l-field); color:var(--ink-2); cursor:default; box-shadow:inset 0 0 0 1px var(--stock-edge)}
  #run .tri{width:0; height:0; border-left:9px solid currentColor; border-top:6px solid transparent; border-bottom:6px solid transparent}

  /* ── the pipeline: the automation's four steps ── */
  .pipe{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border:1px solid var(--stock-edge); background:var(--stock-hi)}
  .stage{position:relative; padding:12px 16px 12px; display:flex; flex-direction:column; gap:6px}
  .stage + .stage{border-left:1px solid var(--stock-edge)}
  .stage .top{display:flex; align-items:center; gap:9px; font:600 12px var(--furn); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2)}
  .stage.on .top{color:var(--ink)}
  .stage .n{font:28px/1 var(--gauge); color:var(--ink)}
  .stage .n small{font-size:14px; color:var(--ink-3)}
  .stage .bar{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--l-off)}
  .stage .bar i{display:block; height:100%; width:0; background:var(--l-led); transition:width .35s cubic-bezier(.16,1,.3,1)}
  .stage .now{font:12.5px var(--gauge); color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:17px}

  /* ── the queue and the lead ── */
  .main{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; min-height:0}
  .queue{border:1px solid var(--stock-edge); display:flex; flex-direction:column; min-height:0}
  .qh, .row{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1.3fr) 74px 104px; align-items:center; column-gap:14px; padding:0 14px}
  .qh{height:34px; border-bottom:1px solid var(--stock-edge); font:600 11px var(--furn); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .rows{position:relative; flex:1; min-height:0}
  .row{position:absolute; left:0; right:0; height:var(--rh); transition:transform .6s cubic-bezier(.16,1,.3,1), background .3s}
  .row + .row{border-top:1px solid var(--rule-soft)}
  .row .co{font:16px var(--sheet); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .ask{font:italic 14.5px var(--sheet); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row.busy{background:color-mix(in srgb, var(--l-led) 7%, transparent)}
  .row.hot{background:color-mix(in srgb, var(--l-led) 11%, transparent)}
  .steps{display:flex; gap:6px}
  .steps i{width:10px; height:10px; border-radius:50%; background:var(--l-off)}
  .steps i.done{background:var(--ink-2)}
  .steps i.now{background:var(--l-led); box-shadow:0 0 8px var(--l-glow)}
  .steps i.skip{background:transparent; box-shadow:inset 0 0 0 1.5px var(--l-off)}
  .fit{display:flex; align-items:center; gap:8px; justify-content:flex-end}
  .fit .num{font:15px var(--gauge); min-width:2ch; text-align:right}
  .fit .meter{width:40px; height:5px; background:var(--l-off)}
  .fit .meter i{display:block; height:100%; width:0; background:var(--ink-2); transition:width .5s cubic-bezier(.16,1,.3,1)}
  .row.hot .fit .meter i{background:var(--l-led)}
  .tag{font:600 10.5px var(--gauge); letter-spacing:.1em; padding:2px 6px; background:var(--l-led); color:var(--on-spot, var(--stock))}
  .tag.cool{background:none; color:var(--ink-3); padding:2px 0}

  .lead{border:1px solid var(--stock-edge); background:var(--stock-hi); padding:18px 20px; display:flex; flex-direction:column; gap:12px; min-height:0}
  .lead .lbl{display:flex; align-items:center; gap:9px; font:600 11px var(--furn); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .lead .empty{margin:auto 0; font:italic 16px var(--sheet); color:var(--ink-3)}
  .lead .who{font:700 26px/1.1 var(--sheet)}
  .lead .contact{font:15px var(--sheet); color:var(--ink-2); margin-top:-6px}
  .facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border-top:1px solid var(--stock-edge); border-bottom:1px solid var(--stock-edge)}
  .facts div{padding:9px 0}
  .facts div + div{padding-left:12px; border-left:1px solid var(--stock-edge)}
  .facts span{display:block; font:600 10.5px var(--furn); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .facts b{display:block; margin-top:3px; font:400 15px var(--sheet)}
  .score{display:flex; align-items:baseline; gap:12px}
  .score .big{font:44px/1 var(--gauge); color:var(--l-led)}
  .score .why{font:15px var(--sheet); color:var(--ink-2)}
  .reply{flex:1; min-height:0; border:1px solid var(--stock-edge); background:var(--stock); padding:12px 14px; font:16px/1.5 var(--sheet); color:var(--ink)}
  .reply .caret{display:inline-block; width:2px; height:1.05em; vertical-align:-.15em; background:var(--l-led); margin-left:1px}
  .send{display:flex; gap:8px}
  .send span{padding:8px 14px; font:600 12.5px var(--furn); letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--stock-edge); color:var(--ink-2)}
  .send span.go{background:var(--ink); color:var(--stock); border-color:var(--ink)}
  [hidden]{display:none !important}

  /* ── narrow: the same tool, stacked ── */
  @media (max-width:640px){
    #tool{padding:16px 14px 14px; gap:12px}
    .head{flex-direction:column; align-items:stretch; gap:12px}
    .title h1{font-size:28px}
    .title [data-g-part="lede"]{display:none}
    .act{justify-content:space-between}
    #run{height:40px; padding:0 16px; font-size:14px}
    .stage{padding:9px 10px 10px; gap:4px}
    .stage .top{font-size:10px; letter-spacing:.08em; gap:6px}
    .stage .n{font-size:22px}
    .stage .now{display:none}
    .main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; gap:12px}
    .qh{display:none}
    .qh, .row{grid-template-columns:minmax(0,1fr) 64px 92px; padding:0 12px}
    .row .ask{display:none}
    /* on a phone the run gets the whole screen, and the answer replaces it:
       the queue alone while the steps run, then the three hot leads and the
       drafted reply */
    .lead{display:none; padding:14px 14px; gap:9px}
    body[data-phase="done"] .lead{display:flex}
    body[data-phase="done"] .rows{flex:none; height:calc(var(--rh) * 3)}
    body[data-phase="done"] .main{grid-template-rows:auto auto; align-content:start}
    .row.below{visibility:hidden}
    .count{font-size:12px}
    .lead .facts, .lead .send{display:none}
    .lead .who{font-size:21px}
    .score .big{font-size:32px}
    .reply{flex:none; font-size:15.5px}
    .row .co{font-size:15px}
  }
</style>
</head>
<body>
<div id="tool">
  <div class="head">
    <div class="title"><div data-g-part="title"></div><div data-g-part="lede"></div></div>
    <div class="act">
      <span class="count" id="count"><i class="led lit"></i><b>12</b> new requests</span>
      <button id="run" type="button"><i class="tri"></i><span>Run triage</span></button>
    </div>
  </div>
  <div class="pipe" id="pipe"></div>
  <div class="main">
    <div class="queue">
      <div class="qh"><span>Company</span><span>Asked for</span><span>Steps</span><span style="text-align:right">Fit</span></div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="lead" id="lead">
      <div class="lbl"><i class="led"></i><span>Hottest lead</span></div>
      <div class="empty">Run triage to research every request.</div>
    </div>
  </div>
</div>
<script>
(async function () {
  "use strict";
  const STEPS = [
    { key: "research", label: "Research" },
    { key: "enrich", label: "Enrich" },
    { key: "score", label: "Score" },
    { key: "draft", label: "Draft" },
  ];
  /** Where a row's Status puts it: how many steps are behind it, and which it is in. */
  const PLACE = {
    new: { done: 0, now: -1 }, research: { done: 0, now: 0 }, enrich: { done: 1, now: 1 },
    score: { done: 2, now: 2 }, draft: { done: 3, now: 3 }, nurture: { done: 3, now: -1, skip: true },
    ready: { done: 4, now: -1 },
  };
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const $ = (id) => document.getElementById(id);

  const pipe = $("pipe"), rowsEl = $("rows"), lead = $("lead"), count = $("count"), run = $("run");
  pipe.innerHTML = STEPS.map((s, i) => `<div class="stage" data-i="${i}">
      <div class="top"><i class="led"></i>${s.label}</div>
      <div class="n"><span>0</span><small> / 12</small></div>
      <div class="now"></div><div class="bar"><i></i></div></div>`).join("");

  let rows = [];
  let order = null;        // row ids, top to bottom; set once and re-sorted at the end
  let shownLead = null;    // the lead on the right, once one is hot and drafted
  let typing = null;

  const narrow = () => matchMedia("(max-width:640px)").matches;
  let fixedRh = null;
  function rowHeight() {
    if (fixedRh) return fixedRh;
    return narrow() ? Math.floor(rowsEl.clientHeight / 12) : Math.max(30, Math.floor(rowsEl.clientHeight / 12));
  }

  function drawRows() {
    const rh = rowHeight();
    rowsEl.style.setProperty("--rh", rh + "px");
    if (!order) order = rows.map((r) => r.id);
    for (const r of rows) {
      let el = rowsEl.querySelector(`[data-id="${r.id}"]`);
      if (!el) {
        el = document.createElement("div");
        el.className = "row";
        el.dataset.id = r.id;
        el.innerHTML = `<span class="co"></span><span class="ask"></span><span class="steps"><i></i><i></i><i></i><i></i></span>
          <span class="fit"><span class="tagslot"></span><span class="num"></span><span class="meter"><i></i></span></span>`;
        rowsEl.appendChild(el);
      }
      const c = r.cells, p = PLACE[c.Status] || PLACE.new;
      el.querySelector(".co").textContent = c.Company;
      el.querySelector(".ask").textContent = c.Ask;
      [...el.querySelectorAll(".steps i")].forEach((d, i) => {
        d.className = i < p.done ? (p.skip && i === 3 ? "skip" : "done") : i === p.now ? "now" : (p.skip && i === 3 ? "skip" : "");
      });
      const fit = c.Fit;
      el.querySelector(".num").textContent = fit == null ? "" : fit;
      el.querySelector(".meter i").style.width = fit == null ? "0" : fit + "%";
      const hot = fit != null && fit >= 80;
      el.classList.toggle("hot", hot);
      el.classList.toggle("busy", p.now >= 0);
      el.querySelector(".tagslot").innerHTML = hot ? `<span class="tag">HOT</span>` : c.Status === "nurture" ? `<span class="tag cool">NURTURE</span>` : "";
      const at = order.indexOf(r.id);
      el.style.transform = `translateY(${at * rh}px)`;
      el.classList.toggle("below", document.body.dataset.phase === "done" && narrow() && at >= 3);
    }
  }

  function drawPipe() {
    STEPS.forEach((s, i) => {
      // the last step is only for the hot ones, so it counts out of them
      const pool = i === 3 ? rows.filter((r) => r.cells.Fit != null && r.cells.Fit >= 80) : rows;
      const done = pool.filter((r) => (PLACE[r.cells.Status] || PLACE.new).done > i).length;
      const inIt = rows.filter((r) => (PLACE[r.cells.Status] || PLACE.new).now === i);
      const st = pipe.children[i];
      st.classList.toggle("on", inIt.length > 0);
      const all = rows.length && rows.every((r) => ["ready", "nurture"].includes(r.cells.Status));
      st.querySelector(".led").className = "led" + (inIt.length ? " lit" : all || (i < 3 && done === rows.length && rows.length) ? " green" : "");
      st.querySelector(".n span").textContent = done;
      const of = i === 3 ? pool.length : rows.length;
      st.querySelector(".n small").textContent = i === 3 && !narrow() ? (of ? ` / ${of} hot` : " / hot") : ` / ${i === 3 && !of ? "–" : of}`;
      st.querySelector(".bar i").style.width = (i === 3 ? (all ? 100 : pool.length ? (done / Math.max(pool.length, 1)) * 100 : 0) : rows.length ? (done / rows.length) * 100 : 0) + "%";
      st.querySelector(".now").textContent = inIt.map((r) => r.cells.Company).join(" · ");
    });
  }

  function drawLead() {
    const hot = rows.find((r) => r.cells.Status === "ready");
    if (!hot || shownLead === hot.id) return;
    shownLead = hot.id;
    const c = hot.cells;
    lead.innerHTML = `
      <div class="lbl"><i class="led lit"></i><span>Hottest lead</span></div>
      <div class="who">${esc(c.Company)}</div>
      <div class="contact">${esc(c.Contact)}</div>
      <div class="facts"><div><span>People</span><b>${esc(c.People)}</b></div><div><span>Funding</span><b>${esc(c.Funding)}</b></div><div><span>Stack</span><b>${esc(c.Stack)}</b></div></div>
      <div class="score"><span class="big">${esc(c.Fit)}</span><span class="why">${esc(c.Why)}</span></div>
      <div class="lbl"><span>Drafted reply</span></div>
      <div class="reply" id="reply"></div>
      <div class="send"><span class="go">Send</span><span>Edit</span></div>`;
    typeReply();
  }

  /** The draft arrives whole; it is written out so the eye can follow it. */
  function typeReply() {
    const hot = rows.find((r) => r.id === shownLead);
    const box = $("reply");
    if (!hot || !box) return;
    const text = String(hot.cells.Reply || ""), t0 = performance.now();
    clearInterval(typing);
    typing = setInterval(() => {
      const n = Math.min(text.length, Math.round((performance.now() - t0) / 9));
      box.innerHTML = esc(text.slice(0, n)) + (n < text.length ? `<span class="caret"></span>` : "");
      if (n >= text.length) clearInterval(typing);
    }, 30);
  }

  function drawCount(state) {
    if (state === "done") {
      const hot = rows.filter((r) => r.cells.Status === "ready").length;
      count.innerHTML = narrow()
        ? `<i class="led green"></i><b>${rows.length}</b> triaged · <b>${hot}</b> hot`
        : `<i class="led green"></i><b>${rows.length}</b> triaged · <b>${hot}</b> hot · <b>${hot}</b> replies drafted`;
    } else if (state === "running") {
      const done = rows.filter((r) => ["ready", "nurture"].includes(r.cells.Status)).length;
      count.innerHTML = `<i class="led lit"></i><b>${done}</b> / ${rows.length} triaged`;
    }
  }

  async function read() {
    const view = await biom.table("inbound", { order: [{ column: "Arrived", dir: "asc" }] });
    rows = view.rows;
    drawRows(); drawPipe(); drawLead();
  }

  run.addEventListener("click", async () => {
    run.disabled = true;
    run.querySelector("span").textContent = "Running";
    const started = await biom.start(biom.page, "triage");
    const id = started && (started.id || started.run || started);
    const tick = async () => {
      await read();
      drawCount("running");
      const r = await biom.run(id);
      if (r && r.status && r.status !== "running") {
        await read();
        drawCount("done");
        run.querySelector("span").textContent = "Done";
        // the payoff: hottest first
        setTimeout(() => {
          order = rows.slice().sort((a, b) => (b.cells.Fit ?? -1) - (a.cells.Fit ?? -1)).map((r) => r.id);
          drawRows();
          setTimeout(() => {
            if (narrow()) {     // the queue gives way to the answer
              fixedRh = rowHeight();
              document.body.dataset.phase = "done";
              drawRows();
              typeReply();
            }
            document.body.dataset.done = "1";
          }, 700);
        }, 250);
        return;
      }
      setTimeout(tick, 120);
    };
    tick();
  });

  await read();
  addEventListener("resize", drawRows);
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
